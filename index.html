const SB_URL='https://kgikdyqyoaqrhsshpmcw.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnaWtkeXF5b2Fxcmhzc2hwbWN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxOTMzODAsImV4cCI6MjEwODc2OTM4MH0.z90ogNsOkfReKLD8le_q9O6N8QxsqvevZH7SUHbqAnI';

];
function ptErro(m){
m=String((m&&m.message)||m||'');
for(const [re,t] of ERROS){const x=m.match(re);if(x)return typeof t==='function'?t(x):t}
return /\b(the|is|are|not|error|invalid|failed|missing|unable|cannot|could|from|blocked|denied|request|requests|please|try|unexpected|internal|server)\b/i.test(m)&&!/[ãçéêíóôõú]/i.test(m)?'Ocorreu um erro. Tente novamente.':m;
}
async function sessaoOk(){
const {data:{session}}=await sb.auth.getSession();
if(!session){sessaoExpirada();throw new Error('Sua sessão expirou. Entre novamente.')}
}
let saindo=false;
function sessaoExpirada(){
if(saindo)return;saindo=true;
try{document.querySelectorAll('dialog[open]').forEach(d=>d.close())}catch(e){}
mostraLogin('Sua sessão expirou. Entre novamente.');
}
function mostraLogin(msg,perfil='admin'){
$('#nav').innerHTML='';
$('#auth-actions').style.display='none';
$('#app').innerHTML=`<form class="c" style="max-width:440px;margin:40px auto" onsubmit="entrar(event)"><h2 style="margin-top:0">Entrar</h2>${msg?`<div class="alert">${esc(msg)}</div>`:''}<label>Perfil de acesso<select name="perfil" id="login-perfil" onchange="atualizaLoginPerfil(this.value)">${Object.entries(PERFIS).map(([k,v])=>`<option value="${k}"${k===perfil?' selected':''}>${v}</option>`).join('')}</select></label><label id="login-usuario-manual">Usuário<input id="login-usuario-texto" name="usuario" type="text" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label><label id="login-conta-wrap" hidden>Usuário<select id="login-conta" name="usuario" class="login-account-list" size="1" disabled onchange="selecionarLoginConta(this)"></select><span id="login-conta-selecionado" class="login-account-selected" hidden><span id="login-conta-nome"></span><button type="button" class="sm" onclick="trocarLoginConta()">Alterar</button></span></label><small id="login-list-note" style="display:block;color:var(--mut);margin:-4px 0 10px" hidden></small><label>Senha<span class="pw"><input id="login-senha" name="senha" type="password" required autocomplete="current-password">${olho()}</span></label><div class="row end"><button class="pri">Entrar</button></div><div id="turnstile-widget" style="margin:12px 0"></div><small id="loginmsg" style="color:var(--mut)"></small></form>`;
atualizaLoginPerfil(perfil);
renderLoginCaptcha();
}
let loginCaptchaToken=null,loginCaptchaWidget=null,loginCaptchaAttempts=0;
function renderLoginCaptcha(){
const host=document.querySelector("#turnstile-widget");if(!host)return;
if(!window.turnstile){if(loginCaptchaAttempts++<40)setTimeout(renderLoginCaptcha,250);else host.textContent="Não foi possível carregar a verificação de segurança. Atualize a página.";return}
loginCaptchaAttempts=0;loginCaptchaToken=null;
if(loginCaptchaWidget!==null){try{window.turnstile.remove(loginCaptchaWidget)}catch(e){}loginCaptchaWidget=null}
host.innerHTML="";
loginCaptchaWidget=window.turnstile.render(host,{sitekey:"0x4AAAAAAFryednho3gvFb2G",callback:t=>{loginCaptchaToken=t;},"expired-callback":()=>{loginCaptchaToken=null;},"error-callback":()=>{loginCaptchaToken=null;}});
}
let loginOptionsSeq=0;
function selecionarLoginConta(select){
const option=select.selectedOptions[0];
if(!option||!option.value)return;
$('#login-conta-nome').textContent=option.textContent;
select.hidden=true;
$('#login-conta-selecionado').hidden=false;
$('#login-list-note').hidden=true;

function trocarLoginConta(){
const select=$('#login-conta');
$('#login-conta-selecionado').hidden=true;
select.hidden=false;select.value='';
$('#login-list-note').hidden=false;
select.focus();

async function atualizaLoginPerfil(perfil){
const manual=$('#login-usuario-manual'),input=$('#login-usuario-texto'),wrap=$('#login-conta-wrap'),select=$('#login-conta'),note=$('#login-list-note');
const seq=++loginOptionsSeq;
if(perfil==='admin'){
manual.hidden=false;input.disabled=false;input.required=true;
wrap.hidden=true;select.hidden=false;$('#login-conta-selecionado').hidden=true;select.disabled=true;select.required=false;select.value='';
note.hidden=true;return
}
manual.hidden=true;input.disabled=true;input.required=false;input.value='';
wrap.hidden=false;select.hidden=false;$('#login-conta-selecionado').hidden=true;select.disabled=true;select.required=true;
select.innerHTML='<option value="">Carregando cadastros…</option>';
note.hidden=false;note.textContent='Carregando cadastros…';
const {data,error}=await sb.rpc('login_options',{p_role:perfil});
if(seq!==loginOptionsSeq||$('#login-perfil')?.value!==perfil)return;
select.innerHTML='';
if(error){
select.disabled=true;select.innerHTML='<option value="">Lista indisponível</option>';
note.textContent='Não foi possível carregar os cadastros. Tente novamente.';
return
}
if(!Array.isArray(data)||data.length===0){
select.disabled=true;select.innerHTML='<option value="">Nenhum cadastro encontrado</option>';
note.textContent='Não há cadastros disponíveis para esse perfil.';
return
}
const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Selecione seu cadastro';select.appendChild(placeholder);
data.forEach(row=>{
const option=document.createElement('option');
option.value=row.username;
option.textContent=(row.display_name||row.username)+(row.access_ready?'':' — acesso não ativo');
option.dataset.accessReady=String(Boolean(row.access_ready));
select.appendChild(option)
});
select.size=Math.min(6,data.length+1);select.disabled=false;
note.textContent=data.some(row=>!row.access_ready)
?'Apenas contas ativadas pelo administrador podem entrar no sistema.'
:'Selecione seu cadastro para preencher o usuário de acesso.';
}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&db)sessaoExpirada()});
function sbDb(){
const cache={},subs={};
const snap=k=>({docs:(cache[k]||[]).map(r=>({id:r.id,data:()=>r.data}))});
async function load(k){
await sessaoOk();
const view=k==='produtos'&&appProfile.role!=='admin'?'catalogo_produtos':k==='reps'&&appProfile.role==='lojista'?'catalogo_representantes':k==='lojas'&&(appProfile.role==='admin'||appProfile.role==='representante')?'catalogo_lojas':null;
let q=sb.from(view||'docs').select('id,data');
if(!view)q=q.eq('col',k).order('created_at');
const {data,error}=await q;
if(error)throw error;
cache[k]=data;(subs[k]||[]).forEach(f=>f(snap(k)));
}
const ok=r=>{if(r.error)throw r.error;return r};
return {
collection:k=>({
onSnapshot(cb,err){
(subs[k]=subs[k]||[]).push(cb);
load(k).catch(err||console.error);
const isView=(k==='produtos'&&appProfile.role!=='admin')||(k==='reps'&&appProfile.role==='lojista')||(k==='lojas'&&(appProfile.role==='admin'||appProfile.role==='representante'));
if(!isView)sb.channel('docs-'+k).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'col=eq.'+k},()=>load(k).catch(console.error)).subscribe();
},
async add(d,ownerId=null){await sessaoOk();const row={col:k,data:d};if(k==='pedidos'){const id=ownerId||(appProfile.role==='lojista'?appProfile.user_id:null);if(id)row.owner_id=id}ok(await sb.from('docs').insert(row));await load(k)}
}),
doc(p){
const [k,id]=p.split('/');
return {
async set(d){await sessaoOk();ok(await sb.from('docs').update({data:d}).eq('id',id));await load(k)},
async update(d){await sessaoOk();const cur=(cache[k]||[]).find(r=>r.id===id);ok(await sb.from('docs').update({data:{...(cur?cur.data:{}),...d}}).eq('id',id));await load(k)},
async delete(){await sessaoOk();ok(await sb.from('docs').delete().eq('id',id));await load(k)}
};
}
};
}
async function entrar(e){
e.preventDefault();
const f=new FormData(e.target),m=$('#loginmsg');m.textContent='Entrando…';
const perfil=String(f.get('perfil')||'');
if(!PERFIS[perfil]){m.textContent='Escolha o tipo de acesso.';return}
if(perfil!=='admin'){
const selected=$('#login-conta')?.selectedOptions?.[0];
if(!selected||!selected.value){m.textContent='Selecione seu cadastro.';return}
if(selected.dataset.accessReady!=='true'){m.textContent='Este pré-cadastro ainda não tem acesso de login ativo. Peça ao administrador para ativar a conta.';return}
}
const usu=String(f.get('usuario')||'').trim().toLowerCase();
if(!usu||/[@\s]/.test(usu)){m.textContent='Digite só o nome de usuário (sem @ e sem espaços).';return}
if(!loginCaptchaToken){m.textContent='Conclua a verificação de segurança antes de entrar.';return}
const captchaToken=loginCaptchaToken;loginCaptchaToken=null;
const {error}=await sb.auth.signInWithPassword({email:usu+DOM_USUARIO,password:f.get('senha'),options:{captchaToken}});
if(loginCaptchaWidget!==null)window.turnstile.reset(loginCaptchaWidget);
if(error){m.textContent=ptErro(error);return}
const {data:{user},error:userError}=await sb.auth.getUser();
if(userError||!user){await sb.auth.signOut({scope:'local'});mostraLogin('Não foi possível validar sua sessão. Tente entrar novamente.',perfil);return}
const {data:p,error:profileError}=await sb.from('user_profiles').select('user_id,role,store_name,rep_id').eq('user_id',user.id).maybeSingle();
if(profileError||!p){await sb.auth.signOut({scope:'local'});mostraLogin('Esta conta ainda não tem um perfil de acesso configurado.',perfil);return}
if(p.role!==perfil){await sb.auth.signOut({scope:'local'});mostraLogin('Esta conta não está cadastrada para entrar como '+PERFIS[perfil]+'.',perfil);return}
if((p.role==='lojista'&&!p.store_name)||(p.role==='representante'&&!p.rep_id)){await sb.auth.signOut({scope:'local'});mostraLogin('O perfil desta conta está incompleto. Peça ao administrador para revisar o cadastro.',perfil);return}
location.reload();
}
const olho=()=>`<button type="button" class="ghost olho" title="Mostrar/ocultar senha" onclick="verSenha(this)">👁</button>`;
function verSenha(b){const i=b.previousElementSibling,v=i.type==='password';i.type=v?'text':'password';b.textContent=v?'🙈':'👁'}
async function sair(){await sb.auth.signOut();location.reload()}
async function senhaVazada(s){
try{
const b=await crypto.subtle.digest('SHA-1',new TextEncoder().encode(s));
const hx=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();
const r=await fetch('https://api.pwnedpasswords.com/range/'+hx.slice(0,5),{headers:{'Add-Padding':'true'}});
if(!r.ok)return 0;
const t=await r.text(),suf=hx.slice(5);
for(const l of t.split(/\r?\n/)){const [a,n]=l.split(':');if(a===suf)return +n||0}
return 0;
}catch(e){return 0}
}
function regrasSenha(s){
const f=[];
if(s.length<8)f.push('no mínimo 8 caracteres');
if(!/[A-ZÀ-Ý]/.test(s))f.push('uma letra maiúscula');
if(!/[0-9]/.test(s))f.push('um número');
if(!/[^A-Za-z0-9À-ÿ\s]/.test(s))f.push('um caractere especial (ex.: ! @ # $ %)');
return f;
}
function trocarSenha(obrigatoria=Boolean(appProfile?.must_change_password)){
modal(obrigatoria?'Crie sua senha pessoal':'Trocar senha',`<p>${obrigatoria?'Por segurança, troque a senha temporária antes de continuar.':'Escolha uma senha nova para sua conta.'}</p><label>Nova senha (mín. 8 caracteres, com letra maiúscula, número e caractere especial)<span class="pw"><input name="s1" type="password" minlength="8" required autocomplete="new-password">${olho()}</span></label><label>Repita a nova senha<span class="pw"><input name="s2" type="password" minlength="8" required autocomplete="new-password">${olho()}</span></label>`,
async f=>{
if(f.s1!==f.s2)throw new Error('As senhas não conferem.');
const fal=regrasSenha(f.s1);
if(fal.length)throw new Error('A senha precisa ter '+fal.join(', ')+'.');
const vz=await senhaVazada(f.s1);
if(vz>0)throw new Error('Esta senha já apareceu em vazamentos de dados ('+vz.toLocaleString('pt-BR')+' vezes). Escolha outra.');
await sessaoOk();
const {error}=await sb.auth.updateUser({password:f.s1});
if(error)throw new Error(ptErro(error));
if(obrigatoria){const {error:rpcError}=await sb.rpc('complete_initial_password_change');if(rpcError)throw new Error('A senha foi alterada, mas não foi possível concluir a ativação. Tente salvar novamente ou peça ajuda ao administrador.');appProfile.must_change_password=false;}
setTimeout(()=>aviso(obrigatoria?'Senha temporária trocada.':'Senha alterada.'),200);
},{preventClose:obrigatoria});
}
</script>
<script>
const S={produtos:[],reps:[],pedidos:[],lojas:[],cadastros:[],materiais:[],config:[]};
const SZ=['P','M','G','GG','G1','G2','G3','G4'];
const ST=['Pendente','Faturado','Enviado','Entregue','Cancelado'];
const TABS_ADMIN=[['painel','Painel'],['produtos','Produtos'],['materia','Matéria-prima'],['pedidos','Pedidos'],['fabricar','Fabricar'],['reps','Representantes'],['cadastros','Cadastros'],['estoque','Estoque']];
const TABS_LOJISTA=[['catalogo','Catálogo'],['pedidos','Pedidos']];
const TABS_REP=[['painel','Comissões'],['catalogo','Catálogo'],['pedidos','Pedidos']];
let db=null,tab='painel',ready=false;
const $=s=>document.querySelector(s);
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CORES_BASE=['Preto','Marinho','Chumbo','Petróleo','Verde militar','Gelo'];
const tot=p=>Object.values(ests(p)).reduce((a,c)=>a+SZ.reduce((b,s)=>b+(+c[s]||0),0),0);
function ests(p){const e=(p&&p.est)||{};return Object.values(e).some(x=>typeof x==='number')?{'Sem cor':e}:e}
function estQ(p,c,t){return +((ests(p)[c]||{})[t])||0}
function coresDe(p,extra=[]){
const e=ests(p),L=[...CORES_BASE];
Object.keys(e).forEach(c=>{const s=SZ.reduce((a,t)=>a+(+(e[c]||{})[t]||0),0);if(!L.includes(c)&&(c!=='Sem cor'||s>0))L.push(c)});
extra.forEach(c=>{if(!L.includes(c))L.push(c)});
return L;
}
function normCor(c){
const x=String(c||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
if(!x)return 'Sem cor';
const m=[['preto','Preto'],['marinho','Marinho'],['chumbo','Chumbo'],['petroleo','Petróleo'],['verde','Verde militar'],['gelo','Gelo']];
for(const [k,v] of m)if(x.includes(k))return v;
return String(c).trim();
}
function linhaCor(c,get,neg){return `<tr><td>${esc(c)}</td>${SZ.map(s=>`<td><input class="qi" type="number" ${neg?'':'min="0"'} data-c="${esc(c)}" data-t="${s}" value="${get(c,s)||''}"></td>`).join('')}</tr>`}
function grade(cores,get,neg){return `<div class="tw" style="margin:0 0 8px"><table class="keep gr"><tr><th>Cor</th>${SZ.map(s=>`<th class="n">${s}</th>`).join('')}</tr>${cores.map(c=>linhaCor(c,get,neg)).join('')}</table></div>`}
function addCor(){
const i=$('#novacor'),c=(i.value||'').trim();if(!c)return;
const t=document.querySelector('#gp table');
if(![...t.querySelectorAll('tr td:first-child')].some(td=>td.textContent.toLowerCase()===c.toLowerCase()))t.insertAdjacentHTML('beforeend',linhaCor(c,()=>0));
i.value='';
}
function lerEst(root){
const est={};
root.querySelectorAll('input.qi').forEach(i=>{(est[i.dataset.c]=est[i.dataset.c]||{})[i.dataset.t]=+i.value||0});
if(est['Sem cor']&&!Object.values(est['Sem cor']).some(v=>v))delete est['Sem cor'];
return est;
}
const prod=id=>S.produtos.find(p=>p.id===id);
const rep=id=>S.reps.find(r=>r.id===id);
const precoG=p=>+((p&&p.precoG!=null)?p.precoG:(p&&p.preco))||0;
const precoDe=(p,t)=>SZ.indexOf(t)>=4?precoG(p):(+p.preco||0);
const pedTotal=o=>(o.itens||[]).reduce((a,i)=>a+i.qtd*i.preco,0);
const precoAtual=i=>{const p=prod(i.prodId);const np=p?precoDe(p,i.tam):0;return np>0?np:(+i.preco||0)};
const pedDesatual=o=>['Pendente','Faturado'].includes(o.status)&&(o.itens||[]).some(i=>Math.abs(precoAtual(i)-(+i.preco||0))>=0.005);

(async()=>{
const {data:{session}}=await sb.auth.getSession();
const {data:{user}}=session?await sb.auth.getUser():{data:{}};
if(!session||!user){if(session)await sb.auth.signOut({scope:'local'});mostraLogin();return}
const {data:profile,error:profileError}=await sb.from('user_profiles').select('user_id,role,store_name,rep_id,must_change_password').eq('user_id',user.id).maybeSingle();
if(profileError||!profile||!PERFIS[profile.role]||(profile.role==='lojista'&&!profile.store_name)||(profile.role==='representante'&&!profile.rep_id)){
await sb.auth.signOut({scope:'local'});mostraLogin('Esta conta ainda não tem um perfil de acesso válido. Peça ao administrador para configurá-lo.');return;
}
appProfile=profile;
$('#auth-actions').style.display='inline';
$('#perfil-atual').textContent=PERFIS[profile.role];
if(profile.must_change_password)trocarSenha(true);
tab=profile.role==='lojista'?'catalogo':profile.role==='representante'?'painel':'painel';
db=sbDb();
if(db){
let n=0;
const COLS=profile.role==='admin'?['produtos','reps','pedidos','lojas','cadastros','materiais','config']:profile.role==='lojista'?['produtos','reps','pedidos']:['produtos','reps','pedidos','lojas'];
for(const k of COLS){
db.collection(k).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(++n>=COLS.length)ready=true;render()},e=>{console.error(e);ready=true;render()});
}
}else ready=true;
render();
})();

function render(){
const tabs=appProfile?.role==='lojista'?TABS_LOJISTA:appProfile?.role==='representante'?TABS_REP:TABS_ADMIN;
if(!tabs.some(([k])=>k===tab))tab=tabs[0][0];
$('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
const a=$('#app');
if(!db&&ready){a.innerHTML='<div class="alert">Não foi possível conectar ao banco de dados. Verifique sua internet e recarregue a página.</div>';return}
a.innerHTML=({painel,produtos,catalogo,materia,pedidos,fabricar,reps,cadastros,estoque})[tab]();
rotula(a);
}

function rotula(root){
root.querySelectorAll('table').forEach(t=>{
if(t.classList.contains('keep'))return;
const hr=t.rows[0];if(!hr||!hr.querySelector('th'))return;
hr.classList.add('hd');
const hs=[...hr.cells].map(c=>c.textContent.trim());
[...t.rows].slice(1).forEach(r=>[...r.cells].forEach((c,i)=>{if(c.colSpan<2)c.setAttribute('data-l',hs[i]||'')}));
});
}
new MutationObserver(()=>rotula($('#dlg'))).observe($('#dlg'),{childList:true});

function painel(){
if(appProfile?.role==='representante')return painelRepresentante();
const ok=S.pedidos.filter(o=>o.status!=='Cancelado');
const fat=ok.reduce((a,o)=>a+pedTotal(o),0);
const pecas=S.produtos.reduce((a,p)=>a+tot(p),0);
const baixos=S.produtos.filter(p=>tot(p)<=(+p.min||0));
const pend=S.pedidos.filter(o=>o.status==='Pendente').length;
const sc=ok.filter(o=>!rep(o.repId)).length;
const fab=fabricarLista().reduce((a,x)=>a+x.f,0);
const linhas=S.reps.map(r=>{const v=ok.filter(o=>o.repId===r.id).reduce((a,o)=>a+pedTotal(o),0);return `<tr><td>${esc(r.nome)}</td><td>${esc(r.regiao)}</td><td class="n">${brl(v)}</td><td class="n">${r.com||0}%</td><td class="n">${brl(v*(r.com||0)/100)}</td></tr>`}).join('');
return `<div class="cards">
 <div class="c"><small>Faturamento (sem cancelados)</small><b>${brl(fat)}</b></div>
 <div class="c"><small>Pedidos pendentes</small><b>${pend}</b></div>
 <div class="c"><small>Peças em estoque</small><b>${pecas}</b></div>
 <div class="c"><small>Produtos com estoque baixo</small><b class="${baixos.length?'low':''}">${baixos.length}</b></div>
 <div class="c"><small>Peças a fabricar</small><b class="${fab?'low':''}">${fab}</b></div></div>
 ${baixos.length?`<div class="alert">⚠ Estoque baixo: ${baixos.map(p=>esc(p.ref+' '+p.nome)+' ('+tot(p)+')').join(', ')}</div>`:''}
 ${sc?`<div class="alert">⚠ ${sc} pedido(s) com representante sem cadastro não entram na comissão. Cadastre o representante e corrija o pedido na aba Pedidos.</div>`:''}
 <div class="bar"><h2>Vendas e comissões por representante</h2></div>
 <div class="tw"><table><tr><th>Representante</th><th>Região</th><th class="n">Vendas</th><th class="n">Comissão %</th><th class="n">A pagar</th></tr>${linhas||'<tr><td colspan="5" class="empty">Cadastre representantes e pedidos para ver os números.</td></tr>'}</table></div>`;
}
function painelRepresentante(){
const r=rep(appProfile.rep_id)||S.reps[0]||{};
const pedidos=S.pedidos.filter(o=>o.repId===appProfile.rep_id&&o.status!=='Cancelado');
const vendas=pedidos.reduce((a,o)=>a+pedTotal(o),0),comissao=+r.com||0;
return `<div class="cards"><div class="c"><small>Representante</small><b>${esc(r.nome||'—')}</b></div><div class="c"><small>Vendas não canceladas</small><b>${brl(vendas)}</b></div><div class="c"><small>Comissão (${comissao}%)</small><b>${brl(vendas*comissao/100)}</b></div><div class="c"><small>Pedidos vinculados</small><b>${pedidos.length}</b></div></div><p style="color:var(--mut)">Os valores consideram apenas pedidos vinculados ao seu cadastro. Pedidos cancelados não entram na comissão.</p>`;
}
function catalogo(){
const r=S.produtos.slice().sort((a,b)=>(a.ref||'').localeCompare(b.ref||'')).map(p=>`<tr><td>${esc(p.ref)}</td><td>${esc(p.nome)}</td><td class="n">${brl(p.preco)}</td><td class="n">${brl(precoG(p))}</td></tr>`).join('');
return `<div class="bar"><h2>Catálogo</h2><button class="pri" onclick="tab='pedidos';render()">+ Novo pedido</button></div><div class="tw"><table><tr><th>Ref.</th><th>Produto</th><th class="n">Preço P–GG</th><th class="n">Preço G1–G4</th></tr>${r||'<tr><td colspan="4" class="empty">Nenhum produto disponível.</td></tr>'}</table></div>`;
}

function produtos(){
const pct=(c,v)=>v>0?Math.round((v-c)/v*100)+'%':'—';
const r=S.produtos.slice().sort((a,b)=>(a.ref||'').localeCompare(b.ref||'')).map(p=>{const c=custoP(p,false),cg=custoP(p,true);return `<tr><td>${esc(p.ref)}</td><td>${esc(p.nome)}${p.tecidoId?`<small>${esc(mat(p.tecidoId)?.nome||'')}</small>`:''}</td><td class="n">${brl(c)}</td><td class="n">${brl(cg)}</td><td class="n">${brl(p.preco)}</td><td class="n">${brl(precoG(p))}</td><td class="n">${pct(c,+p.preco)} / ${pct(cg,precoG(p))}</td><td class="n ${tot(p)<=(+p.min||0)?'low':''}">${tot(p)}</td><td><button class="sm" onclick="verFicha('${p.id}')">Ficha</button><button class="sm" onclick="fProd('${p.id}')">Editar</button><button class="sm del" onclick="del('produtos','${p.id}')">Excluir</button></td></tr>`}).join('');
return `<div class="bar"><h2>Produtos</h2><button class="pri" onclick="fProd()">+ Novo produto</button></div>
 <div class="tw"><table><tr><th>Ref.</th><th>Descrição</th><th class="n">Custo P–GG</th><th class="n">Custo G1–G4</th><th class="n">Preço P–GG</th><th class="n">Preço G1–G4</th><th class="n">Margem</th><th class="n">Estoque</th><th></th></tr>${r||'<tr><td colspan="9" class="empty">Nenhum produto cadastrado.</td></tr>'}</table></div>
 <p style="color:var(--mut)">O custo vem da ficha técnica (tecido do produto + ficha padrão da aba Matéria-prima). Produtos sem tecido escolhido usam o custo manual.</p>`;
}
function fProd(id){
const p=id?prod(id):{};
modal(id?'Editar produto':'Novo produto',`
 <div class="g2"><label>Referência<input name="ref" required inputmode="numeric" pattern="[0-9]+" title="Somente números" oninput="this.value=this.value.replace(/[^0-9]/g,'')" value="${esc(p.ref)}"></label>
 <label>Descrição<input name="nome" required placeholder="Short tactel" value="${esc(p.nome)}"></label>
 <label>Estoque mínimo (peças)<input name="min" type="number" min="0" value="${p.min??0}"></label>
 <label>Preço P ao GG (R$)<input name="preco" type="number" step="0.01" min="0" required value="${p.preco??''}"></label>
 <label>Preço G1 ao G4 (R$)<input name="precoG" type="number" step="0.01" min="0" required value="${p.precoG??p.preco??''}"></label>
 <label>Custo manual (R$)<input name="custo" type="number" step="0.01" min="0" value="${p.custo??''}" title="Usado só se o produto não tiver tecido na ficha técnica"></label></div>
 <fieldset style="border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:8px 0"><legend style="padding:0 6px;font-weight:600">Ficha técnica</legend>
  <label>Tecido<select name="tecidoId"><option value="">— sem ficha (usar custo manual) —</option>${S.materiais.filter(m=>m.tipo==='tecido').sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')).map(m=>`<option value="${m.id}"${m.id===p.tecidoId?' selected':''}>${esc(m.nome)}${m.comp?' · '+esc(m.comp):''}${m.cor?' · '+esc(m.cor):''} (${brl4(matCusto(m))}/m)</option>`).join('')}</select></label>
 <div class="g2"><label>Consumo de tecido P–GG (m por peça)<input name="cons" type="number" step="0.001" min="0" value="${p.cons??''}"></label>
 <label>Consumo de tecido G1–G4 (m por peça)<input name="consG" type="number" step="0.001" min="0" value="${p.consG??''}" placeholder="igual ao P–GG"></label>
 <label>Custo extra (R$ por peça)<input name="extra" type="number" step="0.01" min="0" value="${p.extra??''}"></label></div>
 <small>Os aviamentos, a mão de obra e o custo fixo vêm da ficha padrão (aba Matéria-prima).</small></fieldset>
 <label>Estoque por cor e tamanho (peças que você tem hoje)</label><div id="gp">${grade(coresDe(p),(c,s)=>estQ(p,c,s))}</div>
 <div class="r2"><input id="novacor" placeholder="Outra cor (ex.: Bege)"><button type="button" class="ghost" onclick="addCor()">+ Cor</button></div>`,
async(f,form)=>{
const d={...p,ref:f.ref,nome:f.nome,min:+f.min||0,custo:+f.custo||0,preco:+f.preco||0,precoG:+f.precoG||0,est:lerEst(form),tecidoId:f.tecidoId||'',cons:+f.cons||0,consG:f.consG===''?'':+f.consG||0,extra:+f.extra||0};delete d.id;
id?await db.doc('produtos/'+id).set(d):await db.collection('produtos').add(d);
});
}

const brl4=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:4});
const nf=(n,d=3)=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const mat=id=>S.materiais.find(m=>m.id===id);
const matUn=m=>m.tipo==='tecido'?'MT':(m.un||'UN');
const matCusto=m=>!m?0:m.tipo==='tecido'?(m.cobr==='mt'?(+m.preco||0):(+m.rend>0)?(+m.preco||0)/(+m.rend):0):(+m.preco||0)/((+m.qtdC)>0?+m.qtdC:1);
const fichaDoc=()=>S.config.find(x=>x.tipo==='ficha');
const fichaPad=()=>fichaDoc()||{itens:[],mo:0,fixo:0};
function custoFicha(p,g){
const f=fichaPad(),linhas=[];
(f.itens||[]).forEach(i=>{const m=mat(i.matId);if(!m)return;const cu=matCusto(m);linhas.push({nome:m.nome,cor:m.cor||'',q:+i.qtd||0,un:matUn(m),cu,ct:cu*(+i.qtd||0)})});
const t=mat(p.tecidoId);
if(t){const q=g&&p.consG!==''&&p.consG!=null?+p.consG:+p.cons||0;const cu=matCusto(t);linhas.push({nome:'Tecido: '+t.nome,cor:t.cor||'Cor do produto',q,un:'MT',cu,ct:cu*q,tec:true})}
const mp=linhas.reduce((a,x)=>a+x.ct,0),mo=+f.mo||0,fixo=+f.fixo||0,extra=+p.extra||0;
return {linhas,mp,mo,fixo,extra,total:mp+mo+fixo+extra};
}
const custoP=(p,g)=>p.tecidoId?custoFicha(p,g).total:(+p.custo||0);
function materia(){
const ms=S.materiais.slice().sort((a,b)=>(a.tipo===b.tipo?0:a.tipo==='tecido'?-1:1)||(a.nome||'').localeCompare(b.nome||''));
  const r=ms.map(m=>`<tr><td>${esc(m.nome)}</td><td>${esc(m.cor)}</td><td>${m.tipo==='tecido'?'Tecido':'Aviamento'}</td><td>${esc([m.comp,+m.gram?m.gram+' g/m²':''].filter(Boolean).join(' · '))}</td><td>${esc(m.forn)}</td><td class="n">${m.tipo==='tecido'?brl(m.preco)+(m.cobr==='mt'?'/m':'/kg'):brl(m.preco)+((+m.qtdC||1)!==1?' / '+nf(m.qtdC,0)+' '+esc(matUn(m)):' / '+esc(matUn(m)))}</td><td class="n">${m.tipo==='tecido'?m.cobr==='mt'?'—':(+m.rend?nf(m.rend,2)+' m/kg':'<span class="low">informe</span>'):''}</td><td class="n"><b>${brl4(matCusto(m))}</b>/${esc(matUn(m))}</td><td><button class="sm" onclick="fMat('${m.id}')">Editar</button><button class="sm del" onclick="del('materiais','${m.id}')">Excluir</button></td></tr>`).join('');
const f=fichaPad();
const fr=(f.itens||[]).map(i=>{const m=mat(i.matId);if(!m)return '';const cu=matCusto(m);return `<tr><td>${esc(m.nome)}</td><td>${esc(m.cor)}</td><td class="n">${nf(i.qtd)}</td><td>${esc(matUn(m))}</td><td class="n">${brl4(cu)}</td><td class="n">${brl4(cu*(+i.qtd||0))}</td></tr>`}).join('');
const sub=(f.itens||[]).reduce((a,i)=>a+matCusto(mat(i.matId))*(+i.qtd||0),0);
return `<div class="bar"><h2>Matéria-prima</h2><button class="pri" onclick="fMat()">+ Nova matéria-prima</button></div>
  <div class="tw"><table><tr><th>Nome</th><th>Cor</th><th>Tipo</th><th>Composição / gramatura</th><th>Fornecedor</th><th class="n">Preço de compra</th><th class="n">Rendimento</th><th class="n">Custo de uso</th><th></th></tr>${r||'<tr><td colspan="9" class="empty">Nenhuma matéria-prima cadastrada.</td></tr>'}</table></div>
 <div class="bar"><h2>Ficha técnica padrão</h2><button class="pri" onclick="fFicha()">Editar ficha padrão</button></div>
 <p style="color:var(--mut);margin-top:0">Itens iguais em todas as referências. O tecido e o consumo de cada referência são informados no cadastro do produto.</p>
 <div class="tw"><table><tr><th>Item</th><th>Cor</th><th class="n">Qtde</th><th>Un</th><th class="n">Custo un.</th><th class="n">Custo total</th></tr>${fr||'<tr><td colspan="6" class="empty">Nenhum item na ficha padrão.</td></tr>'}
 <tr><th colspan="5">Aviamentos</th><th class="n">${brl4(sub)}</th></tr><tr><td colspan="5">Mão de obra (por peça)</td><td class="n">${brl(f.mo)}</td></tr><tr><td colspan="5">Custo fixo (por peça)</td><td class="n">${brl(f.fixo)}</td></tr></table></div>`;
}
function fMat(id){
const m=id?mat(id):{tipo:'aviamento',un:'UN',qtdC:1};
modal(id?'Editar matéria-prima':'Nova matéria-prima',`
 <div class="g2"><label>Nome<input name="nome" required value="${esc(m.nome)}" placeholder="Ex.: Elástico 40mm"></label>
 <label>Cor<input name="cor" value="${esc(m.cor)}" placeholder="Ex.: BC, PR"></label>
 <label>Tipo<select name="tipo" onchange="matTipo(this.form)"><option value="aviamento"${m.tipo!=='tecido'?' selected':''}>Aviamento</option><option value="tecido"${m.tipo==='tecido'?' selected':''}>Tecido</option></select></label>

let cadastroAba='lojista';
let statusAcessos={};
let statusAcessosCarregado=false,statusAcessosCarregando=false,statusAcessosErro='';
function statusAcesso(username){return statusAcessos[username]?.status||'pendente'}
function badgeAcesso(username){
const status=statusAcesso(username);
if(status==='ativo')return '<span class="ok">Ativa</span>';
if(status==='recusado')return '<span class="tag">Não aprovada</span>';
if(status==='desativado')return '<span class="tag">Desativada</span>';
return '<span class="tag">Aguardando decisão</span>'
}
function botoesAcesso(username){
const name=esc(username),status=statusAcesso(username);
if(status==='ativo')return '<span class="ok">Acesso liberado</span>';
if(status==='desativado')return `<button type="button" class="sm" data-access-action="activate" data-access-username="${name}">Reativar</button>`;
if(status==='recusado')return `<button type="button" class="sm" data-access-action="activate" data-access-username="${name}">Reconsiderar</button>`;
return `<button type="button" class="sm" data-access-action="activate" data-access-username="${name}">Ativar</button> <button type="button" class="sm del" data-access-action="reject" data-access-username="${name}">Não aceitar</button>`
}
function mensagemStatusAcessos(){
if(statusAcessosCarregando)return '<p class="mut">Carregando situação dos acessos…</p>';
if(statusAcessosErro)return `<div class="alert">${esc(statusAcessosErro)} <button type="button" class="sm" onclick="recarregarStatusAcessos()">Tentar novamente</button></div>`;
return ''
}
async function carregarStatusAcessos(){
if(statusAcessosCarregando)return;
statusAcessosCarregando=true;statusAcessosErro='';
try{
const {data,error}=await sb.functions.invoke('gerenciar-acesso',{body:{action:'list'}});
if(error)throw new Error(await textoErroFuncao(error));
statusAcessos=Object.fromEntries((data?.items||[]).map(item=>[item.username,item]));
statusAcessosCarregado=true;
}catch(e){statusAcessosErro=e.message||'Não foi possível carregar os acessos.';statusAcessosCarregado=true}
finally{statusAcessosCarregando=false;render()}
}
function recarregarStatusAcessos(){statusAcessosCarregado=false;carregarStatusAcessos()}
async function textoErroFuncao(error){
try{const payload=await error.context?.json();if(payload?.error)return payload.error}catch(e){}
return error?.message||'Falha ao comunicar com o servidor.'
}
async function decidirAcesso(username,action){
const pergunta=action==='activate'
?`Ativar o acesso de "${username}" com senha inicial 123456? No primeiro login, será obrigatório criar uma senha pessoal.`
:action==='reject'
?`Não aceitar o acesso de "${username}"? A conta não poderá entrar no sistema.`
:`Desativar o acesso de "${username}"? A conta deixará de conseguir entrar.`;
if(!confirm(pergunta))return;
try{
const {data,error}=await sb.functions.invoke('gerenciar-acesso',{body:{action,username}});
if(error)throw new Error(await textoErroFuncao(error));
if(!data?.item)throw new Error('O servidor não retornou a situação atualizada.');
statusAcessos={...statusAcessos,[username]:data.item};
statusAcessosCarregado=true;
render();
if(action==='activate'&&data.item.temporary_password_set)aviso('Conta ativada. Senha inicial: 123456. A troca da senha será obrigatória no primeiro acesso.');
else if(action==='activate')aviso('Acesso reativado. A senha existente foi mantida.');
else if(action==='reject')aviso('Acesso recusado. Nenhuma senha foi criada.');
else aviso('Acesso desativado.');
}catch(e){aviso(e.message||'Não foi possível atualizar o acesso.')}
}
document.addEventListener('click',e=>{const target=e.target instanceof Element?e.target:null;const btn=target?.closest('[data-access-action]');if(btn)decidirAcesso(btn.dataset.accessUsername,btn.dataset.accessAction)});

}

function normalizaCnpj(v){return String(v||'').replace(/[^0-9a-z]/gi,'').toUpperCase()}
function mascaraCnpj(input){const v=normalizaCnpj(input.value).slice(0,14);input.value=v.length>12?`${v.slice(0,2)}.${v.slice(2,5)}.${v.slice(5,8)}/${v.slice(8,12)}-${v.slice(12)}`:v.length>8?`${v.slice(0,2)}.${v.slice(2,5)}.${v.slice(5)}`:v.length>2?`${v.slice(0,2)}.${v.slice(2)}`:v}
async function buscaCnpj(el){
const form=el?.form||el?.closest('form')||$('#dlg form');if(!form?.elements.cnpj)return;
const status=form.querySelector('#cnpj-info'),cnpj=normalizaCnpj(form.elements.cnpj.value);
if(cnpj.length!==14){if(status)status.textContent='Digite um CNPJ válido com 14 caracteres.';return}
if(el?.matches?.('button'))window.open('https://cnpj.biz/'+encodeURIComponent(cnpj),'_blank','noopener,noreferrer');
if(form.dataset.cnpjConsultado===cnpj||form.dataset.cnpjBuscando==='1')return;
form.dataset.cnpjBuscando='1';if(status)status.textContent='Consultando BrasilAPI e OpenCNPJ…';
const set=(name,value)=>{const campo=form.elements[name];if(campo&&value!==null&&value!==undefined&&String(value).trim()!==''&&!String(campo.value||'').trim())campo.value=String(value).trim()};
const aplica=(data)=>{
const tel=Array.isArray(data.telefones)?data.telefones.filter(t=>!t.is_fax).map(t=>[t.ddd,t.numero].filter(Boolean).join(' ')): [];
const telefones=tel.length?tel:[data.ddd_telefone_1,data.ddd_telefone_2,data.telefone].filter(Boolean).flatMap(v=>String(v).split(/\s*\/\s*/)).filter(Boolean);
set('razaoSocial',data.razao_social||data.nome_empresarial||data.nome);
set('email',data.email);
set('telefone',telefones[0]);
set('telefone2',telefones[1]);
set('logradouro',[data.descricao_tipo_de_logradouro||data.tipo_logradouro,data.logradouro].filter(Boolean).join(' '));
set('numero',data.numero);
set('complemento',data.complemento);
set('bairro',data.bairro);
set('cep',data.cep);
set('municipio',data.municipio||data.localidade);
const uf=String(data.uf||'').toUpperCase();set('uf',ufNome[uf]||uf);
};
try{
const fontes=[
{nome:'BrasilAPI',url:'https://brasilapi.com.br/api/cnpj/v1/'+encodeURIComponent(cnpj)},
{nome:'OpenCNPJ',url:'https://api.opencnpj.org/'+encodeURIComponent(cnpj)},
{nome:'Minha Receita',url:'https://minhareceita.org/'+encodeURIComponent(cnpj)}
];
const buscarSrWatson=async()=>{
try{
const response=await fetch('https://srwatson.io/empresa/'+encodeURIComponent(cnpj),{headers:{Accept:'text/html'}});
if(!response.ok)throw new Error('HTTP '+response.status);
const html=await response.text(),doc=new DOMParser().parseFromString(html,'text/html');
const objetos=[...doc.querySelectorAll('script[type="application/ld+json"]')].flatMap(script=>{try{const valor=JSON.parse(script.textContent||'null');const lista=Array.isArray(valor)?valor:[valor];return lista.flatMap(item=>item&&Array.isArray(item['@graph'])?[item,...item['@graph']]:[item]).filter(Boolean)}catch(error){return[]}});
const empresa=objetos.find(item=>{const tipos=Array.isArray(item['@type'])?item['@type']:[item['@type']];const ids=[item.taxID,item.identifier?.value||item.identifier].filter(Boolean);return tipos.includes('Organization')&&ids.some(id=>normalizaCnpj(id)===cnpj)});
if(!empresa)throw new Error('A página não retornou dados estruturados para este CNPJ.');
const endereco=Array.isArray(empresa.address)?empresa.address[0]:(empresa.address||{});
const rua=String(endereco.streetAddress||'');
const numero=rua.match(/^(.*?)(?:,\s*|\s+)(\d+[A-Za-z]?)$/);
return {fonte:'Sr. Watson',data:{razao_social:empresa.name,email:empresa.email,telefone:empresa.telephone,logradouro:numero?numero[1]:rua,numero:numero?numero[2]:'',cep:endereco.postalCode,municipio:endereco.addressLocality,uf:endereco.addressRegion}};
}catch(error){return {fonte:'Sr. Watson',erro:error.message||'falha na consulta'}}
};
const [resultados,srWatson]=await Promise.all([
Promise.all(fontes.map(async fonte=>{try{const response=await fetch(fonte.url);const data=await response.json();if(!response.ok)throw new Error(data.message||data.error||('HTTP '+response.status));return {fonte:fonte.nome,data}}catch(error){return {fonte:fonte.nome,erro:error.message||'falha na consulta'}}})),
buscarSrWatson()
]);
const consultadas=[],falhas=[];
for(const resultado of [...resultados,srWatson]){if(resultado.data){aplica(resultado.data);consultadas.push(resultado.fonte)}else falhas.push(resultado.fonte)}
if(!consultadas.length)throw new Error('Nenhuma fonte respondeu. Tente novamente.');
const cep=normalizaCnpj(form.elements.cep?.value||'');
if(cep.length===8&&(!form.elements.logradouro?.value||!form.elements.bairro?.value||!form.elements.municipio?.value)){
try{const response=await fetch('https://viacep.com.br/ws/'+encodeURIComponent(cep)+'/json/');const endereco=await response.json();if(response.ok&&!endereco.erro){set('logradouro',endereco.logradouro);set('bairro',endereco.bairro);set('cep',endereco.cep);set('municipio',endereco.localidade);set('uf',endereco.estado||ufNome[String(endereco.uf||'').toUpperCase()]||endereco.uf);if(endereco.logradouro||endereco.bairro||endereco.localidade)consultadas.push('ViaCEP')}}catch(error){falhas.push('ViaCEP')}
}
if(!falhas.length)form.dataset.cnpjConsultado=cnpj;
const faltam=[['E-mail','email'],['Telefone','telefone'],['logradouro','logradouro'],['bairro','bairro'],['município','municipio']].filter(([label,name])=>!String(form.elements[name]?.value||'').trim()).map(([label])=>label);
let mensagem='Dados complementados por: '+consultadas.join(', ')+'. Confira e ajuste antes de salvar.';
if(faltam.length)mensagem+=' Ainda não encontrados: '+faltam.join(', ')+'.';
if(falhas.length)mensagem+=' Fontes indisponíveis nesta tentativa: '+falhas.join(', ')+'.';
if(status)status.textContent=mensagem;
}catch(error){if(status)status.textContent='Não foi possível consultar as fontes de CNPJ: '+(error.message||'erro temporário');}
finally{form.dataset.cnpjBuscando='0'}
}

function semProd(extra){return [...CORES_BASE,...(extra||[]).filter(c=>!CORES_BASE.includes(c))]}
function bloco(pid,get,extra,lida){
const p=pid===undefined?S.produtos[0]:(pid?prod(pid):null);
const opts=(p?'':'<option value="" selected>— escolha a referência —</option>')+S.produtos.slice().sort((a,b)=>(a.ref||'').localeCompare(b.ref||'')).map(x=>`<option value="${x.id}" ${p&&x.id===p.id?'selected':''}>${esc(x.ref)} · ${esc(x.nome)}</option>`).join('');

function trocaProd(sel){
const b=sel.closest('.blk');
const val={};
b.querySelectorAll('input.qi').forEach(i=>{if(+i.value)(val[i.dataset.c]=val[i.dataset.c]||{})[i.dataset.t]=i.value});
const p=prod(sel.value),extra=Object.keys(val);
b.querySelector('.gw').innerHTML=grade(p?coresDe(p,extra):semProd(extra),(c,s)=>(val[c]||{})[s]);
b.classList.toggle('need',!p);

function pendentes(root){let n=0;root.querySelectorAll('.blk').forEach(b=>{if(!prod(b.querySelector('.selp').value)&&[...b.querySelectorAll('input.qi')].some(i=>+i.value>0))n++});return n}

function lerItens(root){

root.querySelectorAll('.blk').forEach(b=>{

b.querySelectorAll('input.qi').forEach(i=>{const q=+i.value||0;if(q>0)r.push({prodId:p.id,desc:p.ref+' '+p.nome,cor:i.dataset.c,tam:i.dataset.t,qtd:q,preco:precoDe(p,i.dataset.t)})});

}

const cliente=role==='lojista'?`<label>Loja<input name="cliente" required value="${esc(appProfile.store_name)}" readonly></label>`:`<label>Cliente (loja)<input name="cliente" required></label>`;
const vinculoLoja=role==='admin'||role==='representante'?`<label>Vincular à conta de lojista (opcional)<select name="ownerId" onchange="selecionaLoja(this)"><option value="">Outro cliente, sem conta cadastrada</option>${S.lojas.map(x=>`<option value="${x.id}" data-nome="${esc(x.nome)}">${esc(x.nome)}</option>`).join('')}</select><small>Pedidos vinculados também aparecem na conta da loja.</small></label>`:'';

 <div class="imp"><div class="r"><input type="file" id="arq" onchange="importar()" accept="image/*,.pdf,application/pdf,.txt,.csv"><button type="button" class="pri" onclick="importar()">Ler arquivo</button></div><small id="impst">Anexe o pedido (PDF, foto, print, CSV ou TXT): o sistema lê sozinho e preenche cliente, representante, referências, cores, tamanhos e quantidades.</small></div>

 <label>Produtos (informe a quantidade de cada cor e tamanho)</label><div id="itens" oninput="checaFalta()" onchange="checaFalta()">${bloco()}</div><div id="falta"></div>

async function img64(b){
const bmp=await createImageBitmap(b);const k=Math.min(1,2000/Math.max(bmp.width,bmp.height));
const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
const u=c.toDataURL('image/jpeg',.85);return {mime:'image/jpeg',data:u.slice(u.indexOf(',')+1)};
}
async function importar(){

if(!f){st.textContent='Escolha um arquivo primeiro.';return}
if(!S.produtos.length){st.textContent='Cadastre os produtos antes de importar.';return}
const isPdf=/pdf/i.test(f.type)||/\.pdf$/i.test(f.name);

const opts={};let texto='';
if(f.type.startsWith('image/')){
const lim=await sample.limits().catch(()=>null);
if(!lim||!lim.images){st.textContent='O envio de imagens não está liberado nesta visualização.';return}
opts.images=[f];
}else if(isPdf){
st.textContent='Abrindo o PDF…';
try{
if(!window.pdfjsLib)throw new Error('biblioteca de PDF indisponível');
const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
const n=Math.min(pdf.numPages,10);
for(let i=1;i<=n;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();texto+=tc.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n\n'}
if(texto.trim().length<80){
texto='';
const lim=await sample.limits().catch(()=>null);
if(!lim||!lim.images){st.textContent='Este PDF parece ser escaneado e o envio de imagens não está liberado aqui.';return}

opts.images=[];
for(let i=1;i<=mx;i++){
const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:1.6});
const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
opts.images.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.85)));
}
}
texto=texto.slice(0,20000);
}catch(e){st.textContent='Não consegui abrir o PDF ('+ptErro(e.message||'erro')+'). Tente enviar um print da página.';return}

st.textContent='Lendo o arquivo…';
const fm0=$('#dlg form');
try{const r=await sample.json(prompt,opts);if($('#dlg form')!==fm0||!$('#dlg').open)return;preencher(r)}
catch(e){if($('#dlg form')!==fm0)return;console.error(e);st.textContent='Não consegui ler o arquivo: '+ptErro(e.message||e.code||'erro')+' Se continuar, tente uma imagem mais nítida ou preencha manualmente.'}
}
const ABERTOS=['Pendente','Faturado'];
const kItem=i=>i.prodId+'|'+(i.cor||'Sem cor')+'|'+i.tam;
function demanda(){
const m={};
S.pedidos.filter(o=>ABERTOS.includes(o.status)).forEach(o=>(o.itens||[]).forEach(i=>{const k=kItem(i);m[k]=(m[k]||0)+i.qtd}));
return m;
}
function ordLinha(x,y){return String(x.ref).localeCompare(String(y.ref))||coresIdx(x.c)-coresIdx(y.c)||SZ.indexOf(x.t)-SZ.indexOf(y.t)}
function coresIdx(c){const i=CORES_BASE.indexOf(c);return i<0?99:i}
function fabricarPedidos(){
const rem={},out=[];
const ped=S.pedidos.filter(o=>ABERTOS.includes(o.status)).sort((a,b)=>(a.numero||0)-(b.numero||0));
ped.forEach(o=>{
const ag={};
(o.itens||[]).forEach(i=>{const k=kItem(i);ag[k]=(ag[k]||0)+i.qtd});
const linhas=[];
for(const k in ag){
const [id,c,t]=k.split('|');const p=prod(id);if(!p)continue;
if(!(k in rem))rem[k]=Math.max(estQ(p,c,t),0);
const a=Math.min(rem[k],ag[k]);rem[k]-=a;
if(ag[k]-a>0)linhas.push({ref:p.ref,nome:p.nome,c,t,d:ag[k],a,f:ag[k]-a,num:o.numero});
}
linhas.sort(ordLinha);
out.push({o,linhas});
});
return out;
}
function fabricarLista(){return fabricarPedidos().flatMap(x=>x.linhas)}
let fabVista=(()=>{try{return localStorage.getItem('fabVista')}catch(e){return null}})()||'pedido';
function fabricar(){
const P=fabricarPedidos();
const com=P.filter(x=>x.linhas.length),sem=P.filter(x=>!x.linhas.length);
const todas=com.flatMap(x=>x.linhas);
const total=todas.reduce((a,x)=>a+x.f,0);
const blocos=com.map(({o,linhas})=>{
const sub=linhas.reduce((a,x)=>a+x.f,0);
const rows=linhas.map(x=>`<tr><td>${esc(x.ref)} · ${esc(x.nome)}</td><td>${esc(x.c)}</td><td>${x.t}</td><td class="n">${x.d}</td><td class="n">${x.a}</td><td class="n low">${x.f}</td></tr>`).join('');
return `<section class="c" style="padding:0;margin-bottom:14px"><div style="padding:12px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><strong style="font-size:16px">Pedido #${o.numero} · ${esc(o.cliente)}</strong><small>${esc(rep(o.repId)?.nome||o.repNome||'—')} · ${esc((o.data||'').split('-').reverse().join('/'))} · ${esc(o.status)}</small></div><div class="low"><strong style="font-size:16px">${sub}</strong> peças a fabricar</div></div><div class="tw" style="margin:0;border:0;border-top:1px solid var(--bd);border-radius:0"><table><tr><th>Produto</th><th>Cor</th><th>Tam.</th><th class="n">Pedido</th><th class="n">Do estoque</th><th class="n">Fabricar</th></tr>${rows}</table></div></section>`;
}).join('');
const g={};
todas.forEach(x=>{const k=x.ref+'|'+x.c+'|'+x.t;const e=g[k]=g[k]||{ref:x.ref,nome:x.nome,c:x.c,t:x.t,f:0,de:[]};e.f+=x.f;e.de.push('#'+x.num+' ('+x.f+')')});
const resumo=Object.values(g).sort(ordLinha).map(e=>`<tr><td>${esc(e.ref)} · ${esc(e.nome)}</td><td>${esc(e.c)}</td><td>${e.t}</td><td class="n low">${e.f}</td><td>${esc(e.de.join(', '))}</td></tr>`).join('');
const pr={};
todas.forEach(x=>{const e=pr[x.ref]=pr[x.ref]||{ref:x.ref,nome:x.nome,cel:{},cores:[],peds:[],f:0};const k=x.c+'|'+x.t;e.cel[k]=(e.cel[k]||0)+x.f;e.f+=x.f;if(!e.cores.includes(x.c))e.cores.push(x.c);if(!e.peds.includes(x.num))e.peds.push(x.num)});
const porRef=Object.values(pr).sort((x,y)=>String(x.ref).localeCompare(String(y.ref))).map(e=>{
const cores=e.cores.sort((x,y)=>coresIdx(x)-coresIdx(y)||x.localeCompare(y));
const rows=cores.map(c=>`<tr><td>${esc(c)}</td>${SZ.map(t=>`<td class="n">${e.cel[c+'|'+t]||''}</td>`).join('')}<td class="n low">${SZ.reduce((a,t)=>a+(e.cel[c+'|'+t]||0),0)}</td></tr>`).join('');
const tot=`<tr><th>Total</th>${SZ.map(t=>`<th class="n">${cores.reduce((a,c)=>a+(e.cel[c+'|'+t]||0),0)||''}</th>`).join('')}<th class="n">${e.f}</th></tr>`;
return `<section class="c" style="padding:0;margin-bottom:14px"><div style="padding:12px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><strong style="font-size:16px">Ref. ${esc(e.ref)} · ${esc(e.nome)}</strong><small>Pedidos: ${e.peds.sort((x,y)=>x-y).map(n=>'#'+n).join(', ')}</small></div><strong class="low">${e.f} peças</strong></div><div class="tw" style="border:0;border-radius:0"><table><tr><th>Cor</th>${SZ.map(t=>`<th class="n">${t}</th>`).join('')}<th class="n">Total</th></tr>${rows}${tot}</table></div></section>`;
}).join('');
const VISTAS=[['pedido','Por pedido'],['referencia','Por referência'],['lista','Lista detalhada (cor e tamanho)']];
if(!VISTAS.some(v=>v[0]===fabVista))fabVista='pedido';
const vazio='<div class="c empty">Nada a fabricar: o estoque cobre todos os pedidos em aberto.</div>';
const corpo=fabVista==='referencia'?(porRef||vazio)
:fabVista==='lista'?(resumo?`<div class="tw"><table><tr><th>Produto</th><th>Cor</th><th>Tam.</th><th class="n">Total</th><th>De quais pedidos</th></tr>${resumo}</table></div>`:vazio)
:(blocos||vazio)+(sem.length?`<p style="color:var(--mut)">Já cobertos pelo estoque: ${sem.map(x=>'#'+x.o.numero).join(', ')}.</p>`:'');
return `<div class="cards"><div class="c"><small>Peças a fabricar</small><b>${total}</b></div><div class="c"><small>Pedidos com itens a fabricar</small><b>${com.length}</b></div></div>
 <div class="bar"><h2>Fabricar</h2><label style="margin:0;display:flex;align-items:center;gap:8px">Mostrar<select id="fabvista" style="width:auto" onchange="fabVista=this.value;try{localStorage.setItem('fabVista',fabVista)}catch(e){};render()">${VISTAS.map(([k,l])=>`<option value="${k}"${k===fabVista?' selected':''}>${l}</option>`).join('')}</select></label></div>
 ${corpo}
 <p style="color:var(--mut)">Considera pedidos Pendente ou Faturado. O estoque (por cor e tamanho) é reservado primeiro para os pedidos mais antigos. Os pedidos não alteram o estoque: quando a produção ficar pronta, lance a entrada na aba Estoque.</p>`;
}
function faltas(itens){
const base=demanda(),add={};
itens.forEach(i=>{const k=kItem(i);add[k]=(add[k]||0)+i.qtd});
const r=[];
for(const k in add){
const [id,c,t]=k.split('|');const p=prod(id);if(!p)continue;
const est=Math.max(estQ(p,c,t),0);const b=base[k]||0;
const falta=Math.max(0,b+add[k]-est)-Math.max(0,b-est);
if(falta>0)r.push({ref:p.ref,cor:c,tam:t,falta});
}
return r;
}
function txtFalta(fl){return fl.map(x=>x.ref+' '+x.cor+' '+x.tam+' ('+x.falta+' a fabricar)').join('; ')}
function checaFalta(){
if(appProfile?.role!=='admin')return;
const box=$('#falta');if(!box)return;
const fl=faltas(lerItens($('#dlg')));
box.innerHTML=fl.length?'<div class="alert">⚠ Sem estoque suficiente: '+esc(txtFalta(fl))+'. Esses itens irão para a aba Fabricar. Você pode salvar mesmo assim.</div>':'';
}
function achaProd(ref){const d=String(ref||'').replace(/\D/g,'');return d?S.produtos.find(p=>String(p.ref).replace(/\D/g,'')===d):null}
const REFINP=`<div class="r2" style="margin-top:8px"><input id="refman" inputmode="numeric" placeholder="Digite a referência (ex.: 5060)" oninput="this.value=this.value.replace(/[^0-9]/g,'')" onkeydown="if(event.key==='Enter'){event.preventDefault();aplicaRef()}"><button type="button" class="pri" onclick="aplicaRef()">Aplicar</button></div>`;
function aplicaRef(){
const i=$('#refman');if(!i||!i.value.trim())return;
const p=achaProd(i.value);
if(!p){aviso('A referência '+i.value+' não está cadastrada. Cadastre o produto antes ou digite outra referência.');return}
document.querySelectorAll('#itens .blk.need .selp').forEach(sel=>{sel.value=p.id;trocaProd(sel)});
$('#impst').innerHTML='Referência '+esc(p.ref)+' aplicada aos itens do arquivo. As cores, tamanhos e quantidades foram mantidos.';
}
function preencher(r){
const fm=$('#dlg form');
if(r.cliente)fm.cliente.value=r.cliente;
if(r.representante&&fm.repNome)fm.repNome.value=r.representante;
if(/^\d{4}-\d{2}-\d{2}$/.test(r.data||''))fm.data.value=r.data;
const por={},pend={},semTam=[];let n=0;
(r.itens||[]).forEach(i=>{
const q=+i.qtd;if(!(q>0))return;
const t=String(i.tam||'').toUpperCase().replace(/\s/g,'').replace(/^XG(\d)$/,'G$1');
if(!SZ.includes(t)){semTam.push(i);return}
const p=achaProd(i.ref);
const c=normCor(i.cor);
const alvo=p?(por[p.id]=por[p.id]||{cel:{},cores:[]}):(pend[String(i.ref||'').trim()]=pend[String(i.ref||'').trim()]||{cel:{},cores:[]});
const k=c+'|'+t;alvo.cel[k]=(alvo.cel[k]||0)+q;
if(!alvo.cores.includes(c))alvo.cores.push(c);
if(p)n++;
});
const idsOk=Object.keys(por),idsPend=Object.keys(pend);
if(idsOk.length||idsPend.length){
$('#itens').innerHTML=
idsOk.map(id=>{const e=por[id];return bloco(id,(c,s)=>e.cel[c+'|'+s],e.cores)}).join('')+
idsPend.map(ref=>{const e=pend[ref];return bloco('',(c,s)=>e.cel[c+'|'+s],e.cores,ref||'não identificada')}).join('');
}
const AL='<div class="alert" style="margin:8px 0 0">⚠ ';
let m=n?'Arquivo lido.':'';
if(idsPend.length){
const lidas=idsPend.filter(x=>x);
m+=(m?'<br>':'')+AL+(idsPend.includes('')?'Não foi possível identificar a referência de alguns itens do arquivo. ':'')+(lidas.length?'Referência(s) não cadastrada(s): '+lidas.map(esc).join(', ')+'. ':'')+'Digite a referência abaixo (vale para todos os itens) ou escolha nos blocos destacados.</div>'+REFINP;
}
if(semTam.length)m+=(m?'<br>':'')+AL+'Não foi possível identificar o tamanho de '+semTam.length+' item(ns). Adicione-os manualmente.</div>';
if(!n&&!idsPend.length&&!semTam.length)m=AL+'Não foi possível identificar a referência no arquivo. Selecione a referência do produto manualmente e informe as quantidades.</div>';
$('#impst').innerHTML=m;
checaFalta();
}

const normNome=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function achaRep(nome){
const n=normNome(nome);if(!n)return;
const ex=S.reps.find(x=>normNome(x.nome)===n);if(ex)return ex;
const c=S.reps.filter(x=>{const r=normNome(x.nome);return r.startsWith(n+' ')||n.startsWith(r+' ')});
return c.length===1?c[0]:undefined;
}
function fRepPed(id){
const o=S.pedidos.find(x=>x.id===id);
modal('Representante do pedido #'+o.numero,`<label>Representante<input name="repNome" required list="replist" autocomplete="off" value="${esc(rep(o.repId)?.nome||o.repNome||'')}"><datalist id="replist">${S.reps.map(r=>`<option value="${esc(r.nome)}">`).join('')}</datalist></label><small style="color:var(--mut)">Escolha um representante cadastrado para o pedido entrar na comissão dele.</small>`,
async f=>{
const rn=(f.repNome||'').trim();
if(!rn)throw new Error('Informe o representante.');
const rp=achaRep(rn);
await db.doc('pedidos/'+id).update({repId:rp?rp.id:'',repNome:rp?rp.nome:rn});
});
}


async function atualizarPrecos(){
const L=S.pedidos.filter(pedDesatual);
if(!L.length){aviso('Os pedidos Pendente e Faturado já estão com os preços atuais dos produtos.');return}
const dif=L.reduce((a,o)=>a+(o.itens||[]).reduce((b,i)=>b+i.qtd*precoAtual(i),0)-pedTotal(o),0);
if(!await confirma(`Atualizar ${L.length} pedido(s) Pendente/Faturado com os preços atuais dos produtos? Pedidos Enviado, Entregue e Cancelado não mudam. Diferença no total: ${dif>=0?'+':''}${brl(dif)}.`))return;
try{
for(const o of L)await db.doc('pedidos/'+o.id).update({itens:o.itens.map(i=>({...i,preco:precoAtual(i)}))});
aviso(L.length+' pedido(s) atualizado(s).');
}catch(e){aviso(e.message||'Erro ao atualizar preços')}
}
async function setSt(id,s){
const o=S.pedidos.find(x=>x.id===id);if(!o||o.status===s)return;
try{
await db.doc('pedidos/'+id).update({status:s});
}catch(e){aviso(e.message);render()}
}
async function delPed(id){
const o=S.pedidos.find(x=>x.id===id);
if(!await confirma('Excluir o pedido #'+o.numero+'?'))return;
await db.doc('pedidos/'+id).delete();
}
function verPed(id){
const o=S.pedidos.find(x=>x.id===id);
const d=$('#dlg');
d.innerHTML=`<h3>Pedido #${o.numero} · ${esc(o.cliente)}</h3><div class="tw"><table><tr><th>Produto</th><th>Cor</th><th>Tam.</th><th class="n">Qtd</th><th class="n">Unit.</th><th class="n">Subtotal</th></tr>${o.itens.map(i=>`<tr><td>${esc(i.desc)}</td><td>${esc(i.cor||'—')}</td><td>${i.tam}</td><td class="n">${i.qtd}</td><td class="n">${brl(i.preco)}</td><td class="n">${brl(i.qtd*i.preco)}</td></tr>`).join('')}</table></div><p><b>Total: ${brl(pedTotal(o))}</b></p><div class="row end"><button class="pri" onclick="dlg.close()">Fechar</button></div>`;
d.showModal();
}

function estoque(){
const rows=S.produtos.slice().sort((a,b)=>(a.ref||'').localeCompare(b.ref||'')).map(p=>{
const cores=coresDe(p);
const lin=cores.map((c,k)=>`<tr><td>${k?'':esc(p.ref)+' · '+esc(p.nome)}</td><td>${esc(c)}</td>${SZ.map(s=>{const v=estQ(p,c,s);return `<td class="n ${v<=0?'mut':''}">${v}</td>`}).join('')}<td class="n">${SZ.reduce((a,s)=>a+estQ(p,c,s),0)}</td><td>${k?'':`<button class="sm" onclick="fEntrada('${p.id}')">Entrada / ajuste</button>`}</td></tr>`).join('');
const sub=`<tr><td></td><td><b>Total</b></td>${SZ.map(s=>`<td class="n"><b>${cores.reduce((a,c)=>a+estQ(p,c,s),0)}</b></td>`).join('')}<td class="n ${tot(p)<=(+p.min||0)?'low':''}"><b>${tot(p)}</b></td><td></td></tr>`;
return lin+sub;
}).join('');
return `<div class="bar"><h2>Estoque por cor e tamanho</h2></div>
 <div class="tw"><table class="keep"><tr><th>Produto</th><th>Cor</th>${SZ.map(s=>`<th class="n">${s}</th>`).join('')}<th class="n">Total</th><th></th></tr>${rows||'<tr><td colspan="12" class="empty">Cadastre produtos para controlar o estoque.</td></tr>'}</table></div>
 <p style="color:var(--mut)">Os pedidos não alteram o estoque. Use “Entrada / ajuste” para lançar produção pronta (valores positivos) ou saídas e perdas (negativos). Para mudar as quantidades de uma vez, use Editar na aba Produtos. O que falta aparece na aba Fabricar.</p>`;
}
function fEntrada(id){
const p=prod(id);
modal('Entrada / ajuste · '+p.ref+' '+p.nome,`<label>Quantidade a somar por cor e tamanho (use negativo para retirar)</label><div id="gp">${grade(coresDe(p),()=>0,true)}</div>`,
async(f,form)=>{
const est=JSON.parse(JSON.stringify(ests(p)));
form.querySelectorAll('input.qi').forEach(i=>{
const d=+i.value||0;if(!d)return;
const c=i.dataset.c,t=i.dataset.t;est[c]=est[c]||{};
const v=(+est[c][t]||0)+d;
if(v<0)throw new Error('O estoque de '+c+' '+t+' ficaria negativo.');
est[c][t]=v;
});
await db.doc('produtos/'+id).update({est});
});
}

function aviso(msg){
msg=ptErro(msg);
const d=document.querySelector('dialog[open]');
if(d){let e=d.querySelector('.err');if(!e){e=document.createElement('div');e.className='alert err';d.prepend(e)}e.textContent=msg;return}
const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',5000);
}
function confirma(msg){
return new Promise(res=>{
const d=$('#cdlg');
d.innerHTML=`<p>${esc(msg)}</p><div class="row end"><button class="ghost" id="cn">Cancelar</button><button class="pri" id="cs">Confirmar</button></div>`;
d.querySelector('#cs').onclick=()=>{res(true);d.close()};
d.querySelector('#cn').onclick=()=>d.close();
d.onclose=()=>res(false);
d.showModal();
});
}
async function del(col,id){if(await confirma('Excluir este registro?'))await db.doc(col+'/'+id).delete()}

function modal(title,body,onOk,options={}){
const d=$('#dlg');
d.innerHTML=`<form method="dialog"><h3>${title}</h3>${body}<div class="row end">${options.preventClose?'':'<button type="button" class="ghost" onclick="dlg.close()">Cancelar</button>'}<button class="pri">${options.preventClose?'Salvar senha':'Salvar'}</button></div></form>`;
d.oncancel=e=>{if(options.preventClose)e.preventDefault()};
d.querySelector('form').onsubmit=async e=>{
e.preventDefault();
try{await onOk(Object.fromEntries(new FormData(e.target)),e.target)}catch(err){aviso(err.message||'Erro ao salvar');return}
d.close();
};
d.showModal();
}
</script>
</body>
