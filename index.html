i" style="width:100%;min-height:48px">Entrar</button></div><div id="turnstile-widget" style="margin:16px 0"></div><small id="loginmsg" style="color:var(--mut);display:block;text-align:center;margin-top:12px"></small></form></div></div>`;

async function senhaVazada(s){
try{
const b=await crypto.subtle.digest('SHA-1',new TextEncoder().encode(s));
const hx=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();
const r=await fetch('https://api.pwnedpasswords.com/range/'+hx.slice(0,5),{headers:{'Add-Padding':'true'}});
if(!r.ok)return 0;
const t=await r.text(),suf=hx.slice(5);
for(const l of t.split(/\r?\n/)){const [a,n]=l.split(':');if(a===suf)return +n||0}
return 0;
}catch(e){return 0}
}

}

// Um botão de ações por linha, no lugar de três. Fica em position:fixed porque
// a tabela rola na horizontal e cortaria um menu posicionado dentro dela.
let menuId=null;
function fechaMenu(){if(menuId){const m=$('#m-'+menuId);if(m)m.hidden=true;menuId=null}}
function abreMenu(ev,id){
ev.stopPropagation();
const m=$('#m-'+id);if(!m)return;
const abrir=m.hidden;fechaMenu();
if(!abrir)return;
const r=ev.currentTarget.getBoundingClientRect();
m.hidden=false;
const lg=m.offsetWidth||186,alt=m.offsetHeight;
m.style.left=Math.max(8,Math.min(r.right-lg,innerWidth-lg-8))+'px';
m.style.top=(innerHeight-r.bottom>alt+12?r.bottom+4:Math.max(8,r.top-alt-4))+'px';
menuId=id;
}
document.addEventListener('click',fechaMenu);
addEventListener('resize',fechaMenu);
addEventListener('scroll',fechaMenu,true);
// itens: ['rótulo','js',classe] · '-' vira separador · {cab:'título'} vira cabeçalho
const acoes=(id,itens)=>`<div style="position:relative;white-space:nowrap"><button class="sm men" title="Ações" aria-label="Ações" onclick="abreMenu(event,'${id}')">⋮</button><div class="menu" id="m-${id}" hidden onclick="event.stopPropagation()">${itens.filter(Boolean).map(x=>x==='-'?'<hr>':x.cab?`<div class="cab">${esc(x.cab)}</div>`:`<button class="${x[2]||''}" onclick="fechaMenu();${x[1]}">${esc(x[0])}</button>`).join('')}</div></div>`;
const selo=s=>`<span class="pill s-${esc((s||'Pendente').toLowerCase())}">${esc(s||'Pendente')}</span>`;
// busca filtra as linhas no próprio DOM: sem re-render, o cursor não salta do campo
function filtra(input){
const q=input.value.trim().toLowerCase();
const tab=input.closest('.bar')?.parentNode?.querySelector('table');
if(!tab)return;
let n=0;
[...tab.rows].forEach(tr=>{
if(tr.querySelector('th'))return;
const bate=!q||tr.textContent.toLowerCase().includes(q);
tr.hidden=!bate;if(bate)n++;
});
const av=input.parentNode.querySelector('.achou');
if(av)av.textContent=q?n+' de '+([...tab.rows].length-1):'';
}
const campoBusca=ph=>`<span style="display:flex;align-items:center;gap:8px;flex:1"><input class="busca" type="search" placeholder="${esc(ph)}" oninput="filtra(this)" aria-label="${esc(ph)}"><small class="achou" style="color:var(--mut)"></small></span>`;
// número no painel leva para a tela que resolve aquele número
function irPara(t,f){if(f){pedFiltro=f;try{localStorage.setItem('pedFiltro',f)}catch(e){}}tab=t;render();return false}
function rotula(root){
root.querySelectorAll('table').forEach(t=>{
if(t.classList.contains('keep'))return;
const hr=t.rows[0];if(!hr||!hr.querySelector('th'))return;
hr.classList.add('hd');
const hs=[...hr.cells].map(c=>c.textContent.trim());
[...t.rows].slice(1).forEach(r=>[...r.cells].forEach((c,i)=>{if(c.colSpan<2)c.setAttribute('data-l',hs[i]||'')}));
});
}
new MutationObserver(()=>rotula($('#dlg'))).observe($('#dlg'),{childList:true});

const imgUrl=n=>n?SB_URL+'/storage/v1/object/public/produtos/'+encodeURIComponent(n):'';
// uma única porta para a foto do produto: catálogo, tabela, ficha e pedido
function foto(p,cls){
const f=imgUrl(p&&p.imgF),c=imgUrl(p&&p.imgC);
if(!f&&!c)return `<div class="${cls} semfoto"></div>`;
const dois=f&&c;
return `<img class="${cls}" src="${f||c}" alt="${esc(((p.ref||'')+' '+(p.nome||'')).trim())}" loading="lazy"${dois?` data-f="${f}" data-c="${c}" data-verso="0" onclick="viraFoto(event,this)" title="Clique para ver as costas"`:''}>`;

function viraFoto(e,img){

const v=img.dataset.verso==='1'?'0':'1';

img.title=v==='1'?'Clique para ver a frente':'Clique para ver as costas';

modal(id?'Editar produto':'Novo produto',`
 <div class="g2"><label>Referência<input name="ref" required inputmode="numeric" pattern="[0-9]+" title="Somente números" oninput="this.value=this.value.replace(/[^0-9]/g,'')" value="${esc(p.ref)}"></label>

 <small>Reduzidas para 1200px e convertidas em JPEG antes de subir. Aparecem no catálogo do lojista.</small></fieldset>

  <label>Tecido<select name="tecidoId"><option value="">— sem ficha (usar custo manual) —</option>${S.materiais.filter(m=>m.tipo==='tecido').sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')).map(m=>`<option value="${m.id}"${m.id===p.tecidoId?' selected':''}>${esc(m.nome)}${m.comp?' · '+esc(m.comp):''}${m.cor?' · '+esc(m.cor):''} (${brl4(matCusto(m))}/m)</option>`).join('')}</select></label>
 <div class="g2"><label>Consumo de tecido P–GG (m por peça)<input name="cons" type="number" step="0.001" min="0" value="${p.cons??''}"></label>

 <div class="g2"><label>Molde P–GG: largura (cm)<input name="molL" type="number" step="0.1" min="0" value="${p.molL||''}" title="Largura do retângulo que envolve todas as partes de uma peça"></label>
 <label>Molde P–GG: comprimento (cm)<input name="molC" type="number" step="0.1" min="0" value="${p.molC||''}"></label>
 <label>Molde G1–G4: largura (cm)<input name="molLG" type="number" step="0.1" min="0" value="${p.molLG||''}" placeholder="igual ao P–GG"></label>
 <label>Molde G1–G4: comprimento (cm)<input name="molCG" type="number" step="0.1" min="0" value="${p.molCG||''}" placeholder="igual ao P–GG"></label>
 <label>Perda de encaixe (%)<input name="perda" type="number" step="0.1" min="0" max="90" value="${p.perda||''}" placeholder="Ex.: 12"></label></div>
 <button type="button" class="ghost" onclick="estimarCons(this.form)">Estimar consumo pelo molde</button>
 <small id="consprev" style="display:block;margin-top:4px">Preenche os dois consumos acima a partir da largura útil do tecido. Estimativa por retângulo: o encaixe real costuma gastar menos.</small>
 <label style="margin:10px 0 0">Molde digitalizado (.plt)<input type="file" name="plt" accept=".plt,.hgl,.hpgl" onchange="lerPlt(this.form)"></label>
 <small>Arquivo de plotter em HP-GL, como os que saem do CAD ou da digitalização. O app separa os painéis, descarta piques e moldura, e calcula o consumo painel por painel.${p.mol?' <b>Este produto já tem molde: '+((p.mol.pecas||[]).length)+' painéis'+(p.mol.arq?' ('+esc(p.mol.arq)+')':'')+'.</b> Escolher outro arquivo substitui.':''}</small>
 <div id="pltprev"></div>
 <label style="display:flex;align-items:center;gap:8px;margin:10px 0 4px"><input type="checkbox" id="fichaProp" style="width:auto;margin:0" ${p.ficha?'checked':''} onchange="toggleFichaProp(this)">Esta referência tem ficha própria</label>
 <small id="fichaPadMsg" style="display:${p.ficha?'none':'block'}">Os aviamentos, a mão de obra e o custo fixo vêm da ficha padrão (aba Matéria-prima). Marque acima para esta referência ter os seus.</small>
 <div id="fichaprop" style="display:${p.ficha?'':'none'}">
  <label>Aviamentos e quantidade por peça</label><div id="fitens">${(fichaDe(p).itens||[]).map(fichaLinha).join('')}</div>
  <button type="button" class="ghost" onclick="$('#fitens').insertAdjacentHTML('beforeend',fichaLinha({}))">+ Item</button>
  <div class="g2" style="margin-top:10px"><label>Mão de obra (R$ por peça)<input name="pmo" type="number" step="0.01" min="0" value="${fichaDe(p).mo??''}"></label>
  <label>Custo fixo (R$ por peça)<input name="pfixo" type="number" step="0.01" min="0" value="${fichaDe(p).fixo??''}"></label></div>
  <small>Começa com uma cópia da ficha padrão. Ajuste o que difere nesta referência.</small></div></fieldset>
 <label>Estoque por cor e tamanho (peças que você tem hoje)</label><div id="gp">${grade(coresDe(p),(c,s)=>estQ(p,c,s))}</div>
 <div class="r2"><input id="novacor" placeholder="Outra cor (ex.: Bege)"><button type="button" class="ghost" onclick="addCor()">+ Cor</button></div>`,
async(f,form)=>{
const d={...p,ref:f.ref,nome:f.nome,min:+f.min||0,custo:+f.custo||0,preco:+f.preco||0,precoG:+f.precoG||0,est:lerEst(form),tecidoId:f.tecidoId||'',cons:+f.cons||0,consG:f.consG===''?'':+f.consG||0,extra:+f.extra||0,molL:+f.molL||0,molC:+f.molC||0,molLG:+f.molLG||0,molCG:+f.molCG||0,perda:+f.perda||0};delete d.id;
if(form.querySelector('#fichaProp').checked)d.ficha=lerFicha(form,f.pmo,f.pfixo);else delete d.ficha;
if(pltMol)d.mol={arq:pltMol.arq,un:'mm',pecas:pltMol.pecas.map(q=>({w:q.w,h:q.h,qtd:q.qtd,pts:q.pts}))};
const upF=form.fotoF.files[0],upC=form.fotoC.files[0];
if(f.delF&&!upF&&p.imgF){await sb.storage.from('produtos').remove([p.imgF]);d.imgF=''}
if(f.delC&&!upC&&p.imgC){await sb.storage.from('produtos').remove([p.imgC]);d.imgC=''}
if(upF)d.imgF=await subirFoto(upF,p.imgF);
if(upC)d.imgC=await subirFoto(upC,p.imgC);
id?await db.doc('produtos/'+id).set(d):await db.collection('produtos').add(d);
});
}

const brl4=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:4});
const nf=(n,d=3)=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const mat=id=>S.materiais.find(m=>m.id===id);
const matUn=m=>m.tipo==='tecido'?'MT':(m.un||'UN');
const matCusto=m=>!m?0:m.tipo==='tecido'?(m.cobr==='mt'?(+m.preco||0):(+m.rend>0)?(+m.preco||0)/(+m.rend):0):(+m.preco||0)/((+m.qtdC)>0?+m.qtdC:1);
const fichaDoc=()=>S.config.find(x=>x.tipo==='ficha');
const fichaPad=()=>fichaDoc()||{itens:[],mo:0,fixo:0};
const fichaDe=p=>(p&&p.ficha)||fichaPad();
const comMax=()=>S.reps.reduce((a,r)=>Math.max(a,+r.com||0),0);
// imposto, despesa e comissão são percentuais do preço de venda, não do custo
function margem(custo,preco){
const f=fichaPad(),imp=+f.imp||0,desp=+f.desp||0,com=comMax(),v=+preco||0;
const ded=v*(imp+desp+com)/100,lucro=v-(+custo||0)-ded;
return {imp,desp,com,ded,lucro,pct:v>0?lucro/v*100:null};
}
const consDe=(p,g)=>g&&p.consG!==''&&p.consG!=null?+p.consG||0:+p.cons||0;
// shortcut: consumo pelo retângulo que envolve o molde, sem rotação nem encaixe real; trocar quando houver polígonos (fase 5)
function consEstimado(largTecido,molL,molC,perda){
const L=(+largTecido||0)*100,w=+molL||0,h=+molC||0;
if(!(L>0&&w>0&&h>0))return null;
const n=Math.floor(L/w);
if(n<1)return null;
return h/100/n*(1+Math.max(0,+perda||0)/100);
}
function estimarCons(fm){
const msg=t=>{$('#consprev').textContent=t};
const t=mat(fm.tecidoId.value);
if(!t)return msg('Escolha o tecido antes de estimar.');
if(!(+t.larg>0))return msg('O tecido "'+t.nome+'" está sem largura útil. Cadastre-a na aba Matéria-prima.');
const perda=fm.perda.value;
const a=consEstimado(t.larg,fm.molL.value,fm.molC.value,perda);
if(a==null)return msg('Informe a largura e o comprimento do molde P–GG. A largura do molde não pode passar da largura útil do tecido ('+nf(t.larg,2)+' m).');
const b=consEstimado(t.larg,fm.molLG.value||fm.molL.value,fm.molCG.value||fm.molC.value,perda);
fm.cons.value=a.toFixed(3);
if(b!=null)fm.consG.value=b.toFixed(3);
const n=Math.floor((+t.larg*100)/(+fm.molL.value));
msg('Estimado com '+nf(t.larg,2)+' m de largura: '+n+' peça(s) lado a lado · '+nf(a)+' m por peça (P–GG)'+(b!=null?' · '+nf(b)+' m (G1–G4)':'')+'. Ajuste à mão se o encaixe real for melhor.');
}
// PLT em HP-GL, do CAD ou da mesa de digitalização: 1 unidade de plotter = 1/40 mm.
// PU levanta a caneta e começa outro contorno; PD desenha até o ponto.
function parsePlt(txt){
const U=1/40,out=[];let at=null;
for(const m of String(txt).matchAll(/(PU|PD)\s*(-?\d+)\s*,\s*(-?\d+)/gi)){
const p=[+m[2]*U,+m[3]*U];
if(m[1].toUpperCase()==='PU'){if(at&&at.length>2)out.push(at);at=[p]}
else if(at)at.push(p);else at=[p];
}
if(at&&at.length>2)out.push(at);
return out;
}
const areaPol=p=>{let s=0;for(let i=0,n=p.length;i<n;i++){const a=p[i],b=p[(i+1)%n];s+=a[0]*b[1]-b[0]*a[1]}return Math.abs(s)/2};
const bboxPol=p=>{let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0;for(const q of p){if(q[0]<x0)x0=q[0];if(q[0]>x1)x1=q[0];if(q[1]<y0)y0=q[1];if(q[1]>y1)y1=q[1]}return {x0,y0,w:x1-x0,h:y1-y0}};
// separa painel de ruído: fora traço curto (pique, sentido do fio, texto) e a moldura de impressão,
// que é um retângulo de poucos pontos cobrindo quase toda a folha
function moldesDePlt(txt,minArea=2000){
const cs=parsePlt(txt);
if(!cs.length)return [];
const fo=bboxPol(cs.flat()),af=fo.w*fo.h;
return cs.map(pts=>({pts,...bboxPol(pts),area:areaPol(pts)}))
.filter(c=>c.area>=minArea&&!(c.pts.length<=6&&af>0&&c.area>=af*0.7))
.sort((a,b)=>b.area-a.area);
}
// consumo somando o retângulo de cada painel, na orientação que gasta menos
// shortcut: ignora o sentido do fio e o encaixe entre painéis; trocar pelo encaixe real sobre os polígonos
function consPecas(largTecido,pecas,perda){
let t=0;
for(const q of pecas||[]){
const n=Math.max(0,Math.round(+q.qtd||0));
if(!n)continue;
const a=consEstimado(largTecido,q.w/10,q.h/10,perda),b=consEstimado(largTecido,q.h/10,q.w/10,perda);
const c=a==null?b:b==null?a:Math.min(a,b);
if(c==null)return null;
t+=c*n;
}
return t>0?t:null;
}

function normalizaCnpj(v){return String(v||'').replace(/[^0-9a-z]/gi,'').toUpperCase()}

async function buscaCnpj(el){
const form=el?.form||el?.closest('form')||$('#dlg form');if(!form?.elements.cnpj)return;
const status=form.querySelector('#cnpj-info'),cnpj=normalizaCnpj(form.elements.cnpj.value);
if(cnpj.length!==14){if(status)status.textContent='Digite um CNPJ válido com 14 caracteres.';return}
if(el?.matches?.('button'))window.open('https://cnpj.biz/'+encodeURIComponent(cnpj),'_blank','noopener,noreferrer');
if(form.dataset.cnpjConsultado===cnpj||form.dataset.cnpjBuscando==='1')return;
form.dataset.cnpjBuscando='1';if(status)status.textContent='Consultando BrasilAPI e OpenCNPJ…';
const set=(name,value)=>{const campo=form.elements[name];if(campo&&value!==null&&value!==undefined&&String(value).trim()!==''&&!String(campo.value||'').trim())campo.value=String(value).trim()};
const aplica=(data)=>{
const tel=Array.isArray(data.telefones)?data.telefones.filter(t=>!t.is_fax).map(t=>[t.ddd,t.numero].filter(Boolean).join(' ')): [];
const telefones=tel.length?tel:[data.ddd_telefone_1,data.ddd_telefone_2,data.telefone].filter(Boolean).flatMap(v=>String(v).split(/\s*\/\s*/)).filter(Boolean);
set('razaoSocial',data.razao_social||data.nome_empresarial||data.nome);
set('email',data.email);
set('telefone',telefones[0]);
set('telefone2',telefones[1]);
set('logradouro',[data.descricao_tipo_de_logradouro||data.tipo_logradouro,data.logradouro].filter(Boolean).join(' '));
set('numero',data.numero);
set('complemento',data.complemento);
set('bairro',data.bairro);
set('cep',data.cep);
set('municipio',data.municipio||data.localidade);
const uf=String(data.uf||'').toUpperCase();set('uf',ufNome[uf]||uf);
};
try{
const fontes=[
{nome:'BrasilAPI',url:'https://brasilapi.com.br/api/cnpj/v1/'+encodeURIComponent(cnpj)},
{nome:'OpenCNPJ',url:'https://api.opencnpj.org/'+encodeURIComponent(cnpj)},
{nome:'Minha Receita',url:'https://minhareceita.org/'+encodeURIComponent(cnpj)}
];
const buscarSrWatson=async()=>{
try{
const response=await fetch('https://srwatson.io/empresa/'+encodeURIComponent(cnpj),{headers:{Accept:'text/html'}});
if(!response.ok)throw new Error('HTTP '+response.status);
const html=await response.text(),doc=new DOMParser().parseFromString(html,'text/html');
const objetos=[...doc.querySelectorAll('script[type="application/ld+json"]')].flatMap(script=>{try{const valor=JSON.parse(script.textContent||'null');const lista=Array.isArray(valor)?valor:[valor];return lista.flatMap(item=>item&&Array.isArray(item['@graph'])?[item,...item['@graph']]:[item]).filter(Boolean)}catch(error){return[]}});
const empresa=objetos.find(item=>{const tipos=Array.isArray(item['@type'])?item['@type']:[item['@type']];const ids=[item.taxID,item.identifier?.value||item.identifier].filter(Boolean);return tipos.includes('Organization')&&ids.some(id=>normalizaCnpj(id)===cnpj)});
if(!empresa)throw new Error('A página não retornou dados estruturados para este CNPJ.');
const endereco=Array.isArray(empresa.address)?empresa.address[0]:(empresa.address||{});
const rua=String(endereco.streetAddress||'');
const numero=rua.match(/^(.*?)(?:,\s*|\s+)(\d+[A-Za-z]?)$/);
return {fonte:'Sr. Watson',data:{razao_social:empresa.name,email:empresa.email,telefone:empresa.telephone,logradouro:numero?numero[1]:rua,numero:numero?numero[2]:'',cep:endereco.postalCode,municipio:endereco.addressLocality,uf:endereco.addressRegion}};
}catch(error){return {fonte:'Sr. Watson',erro:error.message||'falha na consulta'}}
};
const [resultados,srWatson]=await Promise.all([
Promise.all(fontes.map(async fonte=>{try{const response=await fetch(fonte.url);const data=await response.json();if(!response.ok)throw new Error(data.message||data.error||('HTTP '+response.status));return {fonte:fonte.nome,data}}catch(error){return {fonte:fonte.nome,erro:error.message||'falha na consulta'}}})),

const consultadas=[],falhas=[];
for(const resultado of [...resultados,srWatson]){if(resultado.data){aplica(resultado.data);consultadas.push(resultado.fonte)}else falhas.push(resultado.fonte)}

}
if(!falhas.length)form.dataset.cnpjConsultado=cnpj;
const faltam=[['E-mail','email'],['Telefone','telefone'],['logradouro','logradouro'],['bairro','bairro'],['município','municipio']].filter(([label,name])=>!String(form.elements[name]?.value||'').trim()).map(([label])=>label);
let mensagem='Dados complementados por: '+consultadas.join(', ')+'. Confira e ajuste antes de salvar.';
if(faltam.length)mensagem+=' Ainda não encontrados: '+faltam.join(', ')+'.';
if(falhas.length)mensagem+=' Fontes indisponíveis nesta tentativa: '+falhas.join(', ')+'.';

}catch(error){if(status)status.textContent='Não foi possível consultar as fontes de CNPJ: '+(error.message||'erro temporário');}
finally{form.dataset.cnpjBuscando='0'}
}

// encaixe real sobre os polígonos do molde: preenchimento inferior-esquerdo numa grade de 2 cm,
// testando algumas estratégias e ficando com o risco mais curto. Heurística gulosa sozinha erra:
// girar um painel pode encostá-lo na ourela e estragar o resto do risco.
const ENC_RES=20;
function rasterPol(pts,giro){
let p=giro?pts.map(([x,y])=>[-x,-y]):pts;
let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0;
for(const q of p){if(q[0]<x0)x0=q[0];if(q[0]>x1)x1=q[0];if(q[1]<y0)y0=q[1];if(q[1]>y1)y1=q[1]}
p=p.map(([x,y])=>[x-x0,y-y0]);
const cw=Math.max(1,Math.ceil((x1-x0)/ENC_RES)),ch=Math.max(1,Math.ceil((y1-y0)/ENC_RES)),m=new Uint8Array(cw*ch);
const dentro=(px,py)=>{let d=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const [xi,yi]=p[i],[xj,yj]=p[j];
if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)d=!d}return d};
for(let cy=0;cy<ch;cy++)for(let cx=0;cx<cw;cx++)if(dentro((cx+.5)*ENC_RES,(cy+.5)*ENC_RES))m[cy*cw+cx]=1;
return {cw,ch,m};
}
function encaixaBLF(lista,largCel,maxCel,custo){
const occ=new Uint8Array(maxCel*largCel);let maxX=0;
const livre=(r,ox,oy)=>{if(oy+r.ch>largCel||ox+r.cw>maxCel)return false;
for(let cy=0;cy<r.ch;cy++)for(let cx=0;cx<r.cw;cx++)if(r.m[cy*r.cw+cx]&&occ[(ox+cx)*largCel+oy+cy])return false;
return true};
for(const pc of lista){
let b=null;
for(let ox=0;ox<=maxX&&!b;ox++){const cand=[];
pc.rot.forEach((r,i)=>{for(let oy=0;oy+r.ch<=largCel;oy++)if(livre(r,ox,oy)){cand.push({r,ox,oy,i});break}});
if(cand.length){cand.sort((x,y)=>custo(x)-custo(y));b=cand[0]}}
if(!b)b={r:pc.rot[0],ox:maxX,oy:0};
for(let cy=0;cy<b.r.ch;cy++)for(let cx=0;cx<b.r.cw;cx++)if(b.r.m[cy*b.r.cw+cx])occ[(b.ox+cx)*largCel+b.oy+cy]=1;
maxX=Math.max(maxX,b.ox+b.r.cw);
}
return maxX;
}
// comprimento do risco, em metros, para `copias` peças completas no tecido de `largMm` de largura útil
function encaixeMol(pecas,largMm,copias){
const largCel=Math.floor(largMm/ENC_RES);
if(!(largCel>0)||!(copias>0))return null;
const lista=[];
for(const q of pecas||[]){
if(!(q.pts&&q.pts.length>2))return null;
const rot=[rasterPol(q.pts,0),rasterPol(q.pts,1)].filter(r=>r.ch<=largCel);
if(!rot.length)return null;
const n=Math.max(0,Math.round(+q.qtd||0));
for(let c=0;c<copias*n;c++)lista.push({a:(+q.w||0)*(+q.h||0),rot});
}
if(!lista.length)return null;
const maxCel=lista.reduce((a,x)=>a+x.rot[0].cw,0)+4;
let melhor=null;
for(const ord of [(a,b)=>b.a-a.a,(a,b)=>b.rot[0].ch-a.rot[0].ch||b.a-a.a])
for(const custo of [c=>c.oy*1e4+c.ox+c.r.cw,c=>(c.ox+c.r.cw)*1e4+c.oy,c=>c.i*1e4+c.oy]){
const n=encaixaBLF(lista.slice().sort(ord),largCel,maxCel,custo);
if(melhor==null||n<melhor)melhor=n;
}
return melhor==null?null:melhor*ENC_RES/1000;
}
// shortcut: todos os tamanhos do risco usam os painéis do molde importado, sem gradação;
// trocar quando houver um molde por tamanho. Por isso o ganho é conservador nos riscos com muitos tamanhos.
let encCache=new Map();
function encaixeRisco(p,larg,copias,perda){
if(!p||!p.mol||!(p.mol.pecas||[]).length||!(larg>0))return null;
const k=p.id+'|'+copias+'|'+larg;
if(encCache.has(k))return encCache.get(k);
const v=encaixeMol(p.mol.pecas,larg*1000,copias);
const r=v==null?null:v*(1+Math.max(0,+perda||0)/100);
encCache.set(k,r);
return r;
}

function faltas(itens){
const base=demanda(),add={};
itens.forEach(i=>{const k=kItem(i);add[k]=(add[k]||0)+i.qtd});
const r=[];
for(const k in add){
const [id,c,t]=k.split('|');const p=prod(id);if(!p)continue;
const est=Math.max(estQ(p,c,t),0);const b=base[k]||0;
const falta=Math.max(0,b+add[k]-est)-Math.max(0,b-est);
if(falta>0)r.push({ref:p.ref,cor:c,tam:t,falta});
}
return r;
}
