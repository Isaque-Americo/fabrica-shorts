<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digitalizar molde</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="molde/digit.js"></script>
<script src="acesso.js"></script>
<style>
:root{--bg:#f4f4f3;--card:#ffffff;--tx:#18181b;--mut:#71717a;--bd:#e4e4e7;--ac:#c2410c;--fill:#f97316;--acx:#0e0e0f;--ok:#16a34a;--bad:#dc2626;--hd:#18181b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c1f;--tx:#f4f4f5;--mut:#a1a1aa;--bd:#2e2e33;--ac:#fb923c;--fill:#f97316;--acx:#0e0e0f;--ok:#4ade80;--bad:#f87171;--hd:#f4f4f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c1f;--tx:#f4f4f5;--mut:#a1a1aa;--bd:#2e2e33;--ac:#fb923c;--fill:#f97316;--acx:#0e0e0f;--ok:#4ade80;--bad:#f87171;--hd:#f4f4f5;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--ac)}
a:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#aviso{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#aviso .c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:24px;max-width:420px}
.topo{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
.topo a{text-decoration:none;font-size:14px}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{margin:0 0 12px;font:700 26px 'Barlow Condensed',Inter,sans-serif;text-transform:uppercase;letter-spacing:.3px}
.vazio{color:var(--mut);font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:600 16px Inter,sans-serif;cursor:pointer;width:100%}
.btn.pri{background:var(--fill);color:var(--acx);border-color:var(--fill)}
.btn.peq{min-height:40px;width:auto;font-size:14px;padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:10px}
.item{display:block;width:100%;text-align:left;cursor:pointer;color:var(--tx);font:inherit}
.item b{display:block;font-size:16px;overflow-wrap:anywhere}
.item span{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=number]{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.acoes{display:grid;gap:10px;margin:12px 0}
@media (min-width:600px){.acoes{grid-template-columns:1fr 1fr}}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.foto{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px;font-size:12px;color:var(--mut);min-width:0}
.foto img{display:block;width:100%;height:110px;object-fit:contain;background:var(--bg);border-radius:4px}
.foto .bad{color:var(--bad)}.foto .good{color:var(--ok)}
#dig-v.arrasta main{outline:2px dashed var(--ac);outline-offset:-6px}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--hd);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw}
</style>
</head>
<body>
<div id="aviso"><div class="c" id="aviso-c">Carregando…</div></div>
<div id="lista-v" hidden>
  <header class="topo"><a href="index.html">← App</a></header>
  <main>
    <h2>Digitalizar molde</h2>
    <div id="lista"></div>
    <form id="nova" class="card" hidden>
      <label for="n-nome">Nome</label><input type="text" id="n-nome" required maxlength="80">
      <label for="n-tam">Tamanho (opcional)</label><input type="text" id="n-tam" maxlength="20">
      <label for="n-esp">Espaçamento entre as cruzes (cm)</label><input type="number" id="n-esp" value="50" min="1" step="any" required>
      <div class="acoes"><button class="btn pri" type="submit">Criar</button><button class="btn" type="button" id="n-cancela">Cancelar</button></div>
    </form>
    <button class="btn pri" id="n-abre" hidden>Nova digitalização</button>
  </main>
</div>
<div id="dig-v" hidden>
  <header class="topo"><button class="btn peq" id="volta">← Digitalizações</button></header>
  <main>
    <h2 id="d-nome"></h2>
    <p class="vazio" id="d-info"></p>
    <div class="acoes" id="d-acoes" hidden>
      <button class="btn pri" id="d-tirar">Tirar foto</button>
      <button class="btn" id="d-galeria">Da galeria</button>
    </div>
    <p class="vazio" id="d-solta" hidden>No computador, arraste as fotos para esta tela.</p>
    <div class="grade" id="d-fotos"></div>
    <input type="file" id="in-cam" accept="image/*" capture="environment" hidden>
    <input type="file" id="in-gal" accept="image/*" multiple hidden>
  </main>
</div>
<div id="toast" role="status"></div>
<script>
const SB_URL='https://kgikdyqyoaqrhsshpmcw.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnaWtkeXF5b2Fxcmhzc2hwbWN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxOTMzODAsImV4cCI6MjEwODc2OTM4MH0.z90ogNsOkfReKLD8le_q9O6N8QxsqvevZH7SUHbqAnI';
const IS_DEV=location.hostname==='localhost'||location.hostname==='127.0.0.1';
const Q=new URLSearchParams(location.search);
// ?local=1 só em localhost: sem Supabase, tudo no localStorage (para testar a tela sem login)
const LOCAL=IS_DEV&&Q.get('local')==='1';
const sb=LOCAL?null:supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');

function ptErro(e){
const m=String((e&&e.message)||e||'');
if(/failed to fetch|networkerror|network request|load failed|sem conexão/i.test(m))return 'Sem conexão com o servidor.';
if(/session|jwt|refresh token|sessão/i.test(m))return 'Sua sessão expirou. Entre novamente no app.';
if(/row-level security|permission denied|not authorized|sem permissão/i.test(m))return 'Sem permissão para salvar.';
return m||'Erro ao salvar.';
}
function toast(t){const d=$('#toast');d.textContent=t;d.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>d.style.display='none',3500)}

// ---- IndexedDB: fila de envio (fotos já reduzidas, esperando subir) ----
const abrirDb=(nome,store)=>{let p;return ()=>p||(p=new Promise((ok,er)=>{const r=indexedDB.open(nome,1);r.onupgradeneeded=()=>r.result.createObjectStore(store,{keyPath:'arq'});r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)}))};
const idb=(abrir,store)=>async(modo,f)=>{const db=await abrir();return new Promise((ok,er)=>{const t=db.transaction(store,modo),rq=f(t.objectStore(store));t.oncomplete=()=>ok(rq.result);t.onerror=t.onabort=()=>er(t.error)})};
const FILA=idb(abrirDb('digitalizar','fila'),'fila');

// ---- armazenamento: Supabase (docs col 'digitalizacoes' + bucket privado) ou local (localStorage + IndexedDB) ----
const B=LOCAL?(()=>{
const K='digit-local:docs',ler=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}},gravarK=v=>localStorage.setItem(K,JSON.stringify(v));
// rede derrubada (context.setOffline) ou window.simularOffline=true no console
const rede=()=>{if(!navigator.onLine||window.simularOffline)throw new Error('Failed to fetch')};
const BL=idb(abrirDb('digitalizar-local','blobs'),'blobs');
return {
async lista(){rede();return Object.entries(ler()).map(([id,data])=>({id,data}))},
async dig(id){rede();return ler()[id]||null},
async criar(d){rede();const id='d'+Date.now(),t=ler();t[id]=d;gravarK(t);return id},
async gravar(id,d){rede();const t=ler();t[id]=d;gravarK(t)},
async apagar(id){rede();const t=ler();delete t[id];gravarK(t)},
async subir(arq,blob){rede();await BL('readwrite',s=>s.put({arq,blob}))},
async urlFoto(arq){const r=await BL('readonly',s=>s.get(arq));if(!r)throw new Error('Foto não encontrada.');return URL.createObjectURL(r.blob)},
async apagarArqs(l){rede();for(const a of l)await BL('readwrite',s=>s.delete(a))}
};
})():(()=>{
const ok=r=>{if(r.error)throw r.error;return r.data};
async function sessaoOk(){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sua sessão expirou.')}
const bk=()=>sb.storage.from('digitalizacoes');
return {
async lista(){await sessaoOk();return ok(await sb.from('docs').select('id,data').eq('col','digitalizacoes').order('created_at'))},
async dig(id){await sessaoOk();const r=ok(await sb.from('docs').select('data').eq('id',id).eq('col','digitalizacoes').maybeSingle());return r?r.data:null},
async criar(d){await sessaoOk();return ok(await sb.from('docs').insert({col:'digitalizacoes',data:d}).select('id').single()).id},
// update que não acha a linha (RLS) volta vazio sem erro: tratar como falha
async gravar(id,d){await sessaoOk();if(!ok(await sb.from('docs').update({data:d}).eq('id',id).eq('col','digitalizacoes').select('id')).length)throw new Error('Sem permissão para salvar.')},
async apagar(id){await sessaoOk();if(!ok(await sb.from('docs').delete().eq('id',id).eq('col','digitalizacoes').select('id')).length)throw new Error('Sem permissão para apagar.')},
// upsert: repetir o envio da mesma foto não dá erro
async subir(arq,blob){await sessaoOk();ok(await bk().upload(arq,blob,{contentType:'image/jpeg',upsert:true}))},
async urlFoto(arq){await sessaoOk();return ok(await bk().createSignedUrl(arq,3600)).signedUrl},
async apagarArqs(l){await sessaoOk();if(l.length)ok(await bk().remove(l))}
};
})();

// ---- estado e telas (tela: null = lista; id = uma digitalização) ----
let PODE=false,tela=null,DIG=null,fila=[],rodando=false; // fila: toda a fila do IndexedDB, de todas as digitalizações
const urls=new Map(); // arq -> url (assinada ou do blob) já resolvida
const dado=d=>({nome:'',tam:'',esp:500,fotos:[],folha:null,...d});

async function render(){
$('#lista-v').hidden=tela!==null;$('#dig-v').hidden=tela===null;
if(tela===null)return renderLista();
const d=dado(DIG);
$('#d-nome').textContent=d.nome||'(sem nome)';
$('#d-info').textContent=[d.tam&&'Tamanho '+d.tam,'Espaçamento '+d.esp/10+' cm',d.fotos.length+' foto(s)'].filter(Boolean).join(' · ');
$('#d-acoes').hidden=$('#d-solta').hidden=!PODE;
const un=s=>`<div class="foto">${s}</div>`,daqui=fila.filter(i=>i.digId===tela);
$('#d-fotos').innerHTML=daqui.map(i=>un(`<img data-q="${esc(i.arq)}" alt="">`+(i.estado==='falhou'?`<span class="bad">Falhou: ${esc(i.erro)}</span> <button class="btn peq" data-a="retry" data-arq="${esc(i.arq)}">Tentar de novo</button>`:'Enviando…'))).join('')
+d.fotos.map((f,n)=>un(`<img data-f="${esc(f.arq)}" alt="Foto ${n+1}"><span class="good">Enviada</span>`)).join('')
||'<p class="vazio">Nenhuma foto ainda.</p>';
for(const im of document.querySelectorAll('#d-fotos img')){
const q=im.dataset.q,arq=q||im.dataset.f;
if(q){const i=fila.find(i=>i.arq===q);im.src=i.url||(i.url=URL.createObjectURL(i.blob));continue}
if(urls.has(arq))im.src=urls.get(arq);
else B.urlFoto(arq).then(u=>{urls.set(arq,u);im.src=u}).catch(()=>{im.alt='Sem conexão'});
}
}
const pend=id=>{const n=fila.filter(i=>i.digId===id).length;return n?` · <b class="bad">${n} foto(s) aguardando envio</b>`:''};
async function renderLista(){
$('#n-abre').hidden=!PODE||!$('#nova').hidden;
const itens=await B.lista();
$('#lista').innerHTML=itens.length?itens.map(r=>{const d=dado(r.data);return `<button class="card item" data-a="abrir" data-id="${esc(r.id)}"><b>${esc(d.nome||r.id)}</b><span>${d.tam?'Tamanho '+esc(d.tam)+' · ':''}${d.fotos.length} foto(s) · folha montada: ${d.folha?'sim':'não'}${pend(r.id)}</span></button>`}).join(''):'<p class="vazio">Nenhuma digitalização ainda.</p>';
}
async function abrir(id){
const d=await B.dig(id);
if(!d){toast('Digitalização não encontrada.');return}
DIG=d;tela=id;location.hash=id;
await render();processar();
}
async function irLista(){tela=null;DIG=null;soltarUrls();history.replaceState(null,'',location.pathname+location.search);try{await render()}catch(e){toast(ptErro(e))}}

// ---- fotos: reduzir, guardar na fila, subir, acrescentar em fotos ----
function soltarUrls(){for(const i of fila)if(i.url){URL.revokeObjectURL(i.url);i.url=null}}
async function reduzir(file){
const bm=await createImageBitmap(file,{imageOrientation:'from-image'}); // endireita a foto pelo EXIF
const k=Math.min(1,3000/Math.max(bm.width,bm.height)),w=Math.round(bm.width*k),h=Math.round(bm.height*k);
const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bm,0,0,w,h);bm.close();
const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));
if(!blob)throw new Error('Não foi possível reduzir a foto.');
return {blob,w,h};
}
async function receber(files){
if(!PODE||!tela)return;
const id=tela;
for(const f of [...files].filter(f=>f.type.startsWith('image/'))){
try{
const {blob,w,h}=await reduzir(f),arq=id+'/'+crypto.randomUUID()+'.jpg';
await FILA('readwrite',s=>s.put({digId:id,arq,blob,w,h})); // primeiro na fila: nada se perde se o envio falhar
fila.push({digId:id,arq,blob,w,h,estado:'enviando'});if(tela===id)await render();
}catch(e){console.error(e);toast('Foto não aceita: '+ptErro(e))}
}
processar();
}
// uma foto por vez; re-lê o doc antes de gravar para não apagar fotos acrescentadas em outro aparelho
async function processar(){
if(rodando)return;rodando=true;
try{
for(let i;(i=fila.find(x=>x.estado==='enviando'));){
try{
if(!await B.dig(i.digId))throw new Error('Digitalização não encontrada.'); // não cria doc fantasma
await B.subir(i.arq,i.blob);
const d=dado(await B.dig(i.digId));
if(!d.fotos.some(f=>f.arq===i.arq)){d.fotos.push({arq:i.arq,w:i.w,h:i.h,cruzes:[]});await B.gravar(i.digId,d)}
await FILA('readwrite',s=>s.delete(i.arq));
if(i.url)URL.revokeObjectURL(i.url);
fila=fila.filter(x=>x!==i);
if(tela===i.digId)DIG=d;
}catch(e){i.estado='falhou';i.erro=ptErro(e)}
if(tela===i.digId||tela===null)try{await render()}catch(e){}
}
}finally{rodando=false}
}
addEventListener('online',()=>{fila.forEach(i=>i.estado='enviando');processar()});

// ---- eventos ----
document.addEventListener('click',e=>{
const b=e.target.closest('[data-a]');if(!b)return;
if(b.dataset.a==='abrir')abrir(b.dataset.id).catch(x=>toast(ptErro(x)));
if(b.dataset.a==='retry'){const i=fila.find(x=>x.arq===b.dataset.arq);if(i){i.estado='enviando';render();processar()}}
});
$('#n-abre').onclick=()=>{$('#nova').hidden=false;$('#n-abre').hidden=true;$('#n-nome').focus()};
$('#n-cancela').onclick=()=>{$('#nova').hidden=true;$('#n-abre').hidden=!PODE};
$('#nova').onsubmit=async e=>{
e.preventDefault();
const esp=Math.round(parseFloat($('#n-esp').value)*10),nome=$('#n-nome').value.trim();
if(!nome||!(esp>0))return;
try{
const id=await B.criar({nome,tam:$('#n-tam').value.trim(),esp,fotos:[],folha:null,criadaEm:new Date().toISOString(),v:1});
$('#nova').reset();$('#nova').hidden=true;
await abrir(id);
}catch(x){toast(ptErro(x))}
};
$('#volta').onclick=irLista;
$('#d-tirar').onclick=()=>$('#in-cam').click();
$('#d-galeria').onclick=()=>$('#in-gal').click();
for(const el of [$('#in-cam'),$('#in-gal')])el.onchange=()=>{const l=[...el.files];el.value='';receber(l)};
addEventListener('dragover',e=>{if(tela!==null&&PODE)e.preventDefault()});
addEventListener('drop',e=>{if(tela===null||!PODE)return;e.preventDefault();receber(e.dataTransfer.files)});

function bloquear(msg,entrar){
$('#lista-v').hidden=$('#dig-v').hidden=true;$('#aviso').hidden=false;
const c=$('#aviso-c');c.textContent=msg;
if(entrar){const a=document.createElement('a');a.href='index.html';a.textContent='Entrar';a.style.cssText='display:block;margin-top:14px';c.append(a)}
}

async function iniciar(){
try{
let perfil=null;
if(!LOCAL){
const {data:{session}}=await sb.auth.getSession();
const {data:{user}}=session?await sb.auth.getUser():{data:{}};
if(!session||!user)return bloquear('Entre no app para digitalizar moldes.',true);
({data:perfil}=await sb.from('user_profiles').select('role,is_principal,permissoes').eq('user_id',user.id).maybeSingle());
if(!Acesso.pode(perfil,'moldes','ver'))return bloquear('Só administradores com acesso a moldes digitalizam moldes.');
}
PODE=LOCAL||Acesso.pode(perfil,'moldes','mexer');
fila=(await FILA("readonly",s=>s.getAll())).map(i=>({...i,estado:"enviando"}));
const h=decodeURIComponent(location.hash.slice(1));
$('#aviso').hidden=true;
if(h){try{await abrir(h)}catch(e){toast(ptErro(e))}}
if(tela===null)await render();
processar(); // toda a fila pendente, de qualquer digitalização
}catch(e){console.error(e);bloquear('Não foi possível abrir a página. '+ptErro(e))}
}
iniciar();
</script>
</body>
</html>
