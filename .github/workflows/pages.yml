name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # deploy-pages procura o artefato pela API de Actions; sem isso da "No artifacts named github-pages"

# cancelar no meio deixava a publicacao do Pages pendurada e a proxima falhava
# no passo "Deploy to GitHub Pages"; com false as publicacoes entram na fila
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site
          cp *.html _site/
          cp acesso.js _site/acesso.js
          cp -r molde _site/molde
          cp -r img _site/img
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
