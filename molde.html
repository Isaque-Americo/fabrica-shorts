<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor de molde</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="molde/geo.js"></script>
<script src="molde/modelo.js"></script>
<script src="molde/desenho.js"></script>
<style>
:root{--bg:#f8f9fa;--card:#ffffff;--tx:#212529;--mut:#6c757d;--bd:#dee2e6;--ac:#007bff;--acx:#ffffff;--ok:#28a745;--warn:#ffc107;--bad:#dc3545;--hd:#343a40;
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#18202e;--tx:#e8ecf3;--mut:#93a0b5;--bd:#2a3447;--ac:#6ea8fe;--acx:#0b1424;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--hd:#0b1020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--card:#18202e;--tx:#e8ecf3;--mut:#93a0b5;--bd:#2a3447;--ac:#6ea8fe;--acx:#0b1424;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--hd:#0b1020;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button.pri,button.ghost,button.sm{font:inherit;border-radius:8px;cursor:pointer;padding:8px 14px;border:1px solid var(--ac)}
button.pri{background:var(--ac);color:var(--acx)}
button.ghost,button.sm{background:none;color:var(--ac)}
button.sm{padding:4px 10px;font-size:13px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
a{color:var(--ac)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(520px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#aviso{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#aviso .c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:24px;max-width:420px}
#editor{height:100%;display:grid;grid-template:auto 1fr/auto 1fr 240px;grid-template-areas:"topo topo topo" "ferr tela painel"}
#topo{grid-area:topo;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
#topo a.volta{text-decoration:none;font-size:14px;margin-right:4px}
#nome{font-weight:600;min-width:160px;max-width:320px;flex:1}
#estado{font-size:13px;color:var(--mut);white-space:nowrap}
#estado.ok{color:var(--ok)}#estado.erro{color:var(--bad);font-weight:600}
#topo .grupo{display:flex;align-items:center;gap:4px}
#topo .esp{flex:1}
#zoom-v{min-width:56px}
#ferramentas{grid-area:ferr;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--card);border-right:1px solid var(--bd);min-width:52px}
#tela{grid-area:tela;width:100%;height:100%;display:block;background:var(--bg);touch-action:none}
#painel{grid-area:painel;background:var(--card);border-left:1px solid var(--bd);padding:12px;overflow:auto}
#painel h2{margin:0 0 8px;font-size:16px;font-family:'Poppins',sans-serif;font-weight:600}
.vazio{color:var(--mut);font-size:13px}
#refs{max-height:50vh;overflow:auto;margin:8px 0;border:1px solid var(--bd);border-radius:8px}
#refs label{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--bd);cursor:pointer}
#refs label:last-child{border-bottom:0}
#refs small{color:var(--mut)}
#ref-busca{width:100%}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--hd);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw}
#dica{font-size:13px;color:var(--mut);flex-basis:100%;order:9;min-height:1.5em}
#ferramentas button{font:inherit;font-size:18px;line-height:1;width:38px;height:38px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
#ferramentas button[aria-pressed="true"]{background:var(--ac);color:var(--acx);border-color:var(--ac)}
#ferramentas hr{width:100%;border:0;border-top:1px solid var(--bd);margin:4px 0}
#tela .tr{fill:none;stroke:var(--tx);stroke-width:1.5px;vector-effect:non-scaling-stroke}
#tela .tr.sel{stroke:var(--ac);stroke-width:3px}
#tela .pt{fill:var(--tx)}#tela .pt.solto{fill:var(--mut)}#tela .pt.sel{fill:var(--ac)}
#tela .tx{fill:var(--tx);font-family:'Inter',sans-serif}#tela .tx.sel{fill:var(--ac)}
#tela .alca,#tela .prev{fill:none;stroke:var(--ac);stroke-width:1px;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
#tela .alca-p{fill:var(--card);stroke:var(--ac);stroke-width:1.5px;vector-effect:non-scaling-stroke}
#tela .caixa{fill:var(--ac);fill-opacity:.08;stroke:var(--ac);stroke-width:1px;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
#tela .ima{fill:none;stroke:var(--ok);stroke-width:2px;vector-effect:non-scaling-stroke}
#regua{pointer-events:none}#regua rect{fill:var(--card)}#regua line{stroke:var(--mut);stroke-width:1px;vector-effect:non-scaling-stroke}#regua text{fill:var(--mut);font-family:'Inter',sans-serif}
#pecas{pointer-events:none}
#tela .pc .cost{fill:var(--ac);fill-opacity:.06;stroke:var(--ac);stroke-width:1.5px;vector-effect:non-scaling-stroke}
#tela .pc.sel .cost{fill-opacity:.14;stroke-width:2.5px}
#tela .pc .corte{fill:none;stroke:var(--tx);stroke-width:1px;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
#tela .pc .fio,#tela .pc .piq{fill:none;stroke:var(--tx);stroke-width:1.2px;vector-effect:non-scaling-stroke}
#tela .pc-tx{fill:var(--tx);font-family:'Inter',sans-serif}
#tela .ponta-erro{fill:none;stroke:var(--bad);stroke-width:2.5px;vector-effect:non-scaling-stroke}
#btn-extrair{width:100%;margin-bottom:8px}
.pc-item{display:flex;align-items:center;gap:4px;padding:4px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px}
.pc-item.sel{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.pc-item .mini{width:36px;height:36px;flex:none}
.pc-item .mini path{fill:var(--ac);fill-opacity:.15;stroke:var(--ac);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.pc-nome{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--tx);font:inherit;font-size:13px;cursor:pointer;padding:2px;overflow-wrap:anywhere}
.pc-nome small{display:block;color:var(--bad);font-weight:600}
.pc-item .ic{flex:none;width:26px;height:26px;padding:0;border:1px solid var(--bd);border-radius:6px;background:none;color:var(--tx);font-size:14px;cursor:pointer}
.pc-item .ic[aria-pressed="true"],#props [aria-pressed="true"]{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.pc-ren{flex:1;min-width:0;font-size:13px;padding:2px 4px}
#props{border:1px solid var(--bd);border-radius:8px;margin:8px 0 0;padding:8px;min-width:0}
#props legend{font-weight:600;font-size:14px;padding:0 4px}
#props label{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:6px 0;font-size:13px}
#props input:not([type=checkbox]),#props select{width:112px}
#props .modos{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
#props p{margin:8px 0 0}
select{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#medida{position:fixed;z-index:50;width:190px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#medida[aria-invalid="true"]{border-color:var(--bad)}
@media (max-width:760px){
#ferramentas{overflow-x:auto}#ferramentas hr{width:auto;height:auto;border-top:0;border-left:1px solid var(--bd);margin:0 4px}
#editor{grid-template:auto auto 1fr auto/1fr;grid-template-areas:"topo" "ferr" "tela" "painel"}
#ferramentas{flex-direction:row;border-right:0;border-bottom:1px solid var(--bd)}
#painel{border-left:0;border-top:1px solid var(--bd);max-height:30vh}
}
</style>
</head>
<body>
<div id="aviso"><div class="c" id="aviso-c">Carregando…</div></div>
<div id="editor" hidden>
  <header id="topo">
    <a class="volta" href="index.html" title="Voltar ao app">← App</a>
    <input id="nome" aria-label="Nome do molde" placeholder="Nome do molde" autocomplete="off">
    <span id="estado" role="status" aria-live="polite">Salvo</span>
    <span id="dica" aria-live="polite"></span>
    <span class="esp"></span>
    <button class="sm" type="button" id="btn-refs" title="Produtos que usam este molde">Referências <span id="refs-n"></span></button>
    <span class="grupo" role="group" aria-label="Zoom">
      <button class="sm" type="button" id="zoom-menos" title="Diminuir zoom" aria-label="Diminuir zoom">−</button>
      <button class="sm" type="button" id="zoom-v" title="Voltar a 100%">100%</button>
      <button class="sm" type="button" id="zoom-mais" title="Aumentar zoom" aria-label="Aumentar zoom">+</button>
    </span>
    <span class="grupo" role="group" aria-label="Histórico">
      <button class="sm" type="button" id="btn-desfazer" title="Desfazer (Ctrl+Z)">Desfazer</button>
      <button class="sm" type="button" id="btn-refazer" title="Refazer (Ctrl+Y)">Refazer</button>
    </span>
  </header>
  <nav id="ferramentas" aria-label="Ferramentas"></nav>
  <svg id="tela" role="img" aria-label="Área de desenho do molde" xmlns="http://www.w3.org/2000/svg">
    <defs><pattern id="grade" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="var(--bd)" stroke-width="0.4"/></pattern></defs>
    <rect id="fundo" x="-5000" y="-5000" width="10000" height="10000" fill="url(#grade)"/>
    <g id="diagrama"></g><g id="pecas"></g><g id="regua"></g>
  </svg>
  <aside id="painel" aria-label="Moldes"><h2>Moldes</h2>
    <button class="sm" type="button" id="btn-extrair" title="Cria uma peça com os traços selecionados (contorno fechado)">Extrair molde</button>
    <div id="lista-pecas"></div>
    <fieldset id="props" hidden>
      <legend>Propriedades</legend>
      <label>Nome <input id="p-nome" autocomplete="off"></label>
      <label>Cortar <input id="p-cortar" type="number" min="1" step="1"></label>
      <label><span><input id="p-par" type="checkbox"> em par (espelhado)</span></label>
      <label>Margem (cm) <input id="p-margem" inputmode="decimal" autocomplete="off"></label>
      <label>Dobra <select id="p-dobra"></select></label>
      <div class="modos" role="group" aria-label="Marcar no contorno">
        <button class="sm" type="button" data-modo="bainha" title="Margem só de um traço (ex.: bainha)">Margem do traço</button>
        <button class="sm" type="button" data-modo="pique">Piques</button>
        <button class="sm" type="button" data-modo="pence">Pence</button>
      </div>
      <p class="vazio">Fio: arraste as pontas da seta na tela.</p>
      <p class="vazio" id="p-info"></p>
    </fieldset>
  </aside>
</div>
<dialog id="dlg-refs" aria-labelledby="dlg-refs-t">
  <h3 id="dlg-refs-t">Referências deste molde</h3>
  <small style="color:var(--mut)">Marque os produtos que usam este molde. Ao salvar, o molde vai para o cálculo de consumo de cada um.</small>
  <input id="ref-busca" type="search" placeholder="Buscar referência ou nome" aria-label="Buscar produto" style="margin-top:10px">
  <div id="refs"><p class="vazio" style="padding:10px">Carregando…</p></div>
  <div class="row"><button class="pri" type="button" id="refs-ok">Fechar</button></div>
</dialog>
<input id="medida" hidden autocomplete="off" aria-label="Medida exata" title="Enter fixa, Esc cancela">
<div id="toast" role="status"></div>
<script>
const SB_URL='https://kgikdyqyoaqrhsshpmcw.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtnaWtkeXF5b2Fxcmhzc2hwbWN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxOTMzODAsImV4cCI6MjEwODc2OTM4MH0.z90ogNsOkfReKLD8le_q9O6N8QxsqvevZH7SUHbqAnI';
const IS_DEV=location.hostname==='localhost'||location.hostname==='127.0.0.1';
const Q=new URLSearchParams(location.search);
// ?local=1 só em localhost: sem Supabase, tudo no localStorage (para testar a tela sem login)
const LOCAL=IS_DEV&&Q.get('local')==='1';
const sb=LOCAL?null:supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const MM=window.MoldeModelo;

function ptErro(e){
const m=String((e&&e.message)||e||'');
if(/failed to fetch|networkerror|network request|load failed|sem conexão/i.test(m))return 'Sem conexão com o servidor.';
if(/session|jwt|refresh token|sessão/i.test(m))return 'Sua sessão expirou. Entre novamente no app.';
if(/row-level security|permission denied|not authorized|sem permissão/i.test(m))return 'Sem permissão para salvar.';
return m||'Erro ao salvar.';
}
function toast(t){const d=$('#toast');d.textContent=t;d.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>d.style.display='none',3500)}

// ---- armazenamento: Supabase (docs) ou local; o resto da página não sabe qual ----
const B=LOCAL?(()=>{
const K='molde-local:',ler=k=>{try{return JSON.parse(localStorage.getItem(K+k))}catch(e){return null}},gravarK=(k,v)=>localStorage.setItem(K+k,JSON.stringify(v));
// rede derrubada (context.setOffline) ou window.simularOffline=true no console
const rede=()=>{if(!navigator.onLine||window.simularOffline)throw new Error('Failed to fetch')};
if(!ler('produtos'))gravarK('produtos',{
'p-teste-1':{ref:'101',nome:'Short tactel masculino'},
'p-teste-2':{ref:'102',nome:'Short moletom infantil'},
'p-teste-3':{ref:'103',nome:'Bermuda sarja',mol:{arq:'BERMUDA.PLT',un:'mm',pecas:[{w:600,h:300,qtd:2,pts:[[0,0],[600,0],[600,300],[0,300]]}]}}});
const moldes=()=>ler('moldes')||{};
return {
async molde(id){rede();return moldes()[id]||null},
async moldePorProduto(pid){rede();const e=Object.entries(moldes()).find(([,d])=>(d.produtoIds||[]).includes(pid));return e?{id:e[0],data:e[1]}:null},
async criar(d){rede();const id='m'+Date.now(),t=moldes();t[id]=d;gravarK('moldes',t);return id},
async gravar(id,d){rede();const t=moldes();t[id]=d;gravarK('moldes',t)},
async produtos(){rede();return Object.entries(ler('produtos')).map(([id,data])=>({id,data}))},
async produto(id){rede();return ler('produtos')[id]||null},
async gravarProduto(id,d){rede();const t=ler('produtos');t[id]=d;gravarK('produtos',t)}
};
})():(()=>{
const ok=r=>{if(r.error)throw r.error;return r.data};
async function sessaoOk(){const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sua sessão expirou.')}
// update que não acha a linha (RLS) volta vazio sem erro: tratar como falha para não perder a alteração
const atualizar=async(id,d)=>{await sessaoOk();if(!ok(await sb.from('docs').update({data:d}).eq('id',id).select('id')).length)throw new Error('Sem permissão para salvar.')};
return {
async molde(id){await sessaoOk();const r=ok(await sb.from('docs').select('data').eq('id',id).eq('col','moldes').maybeSingle());return r?r.data:null},
async moldePorProduto(pid){await sessaoOk();return ok(await sb.from('docs').select('id,data').eq('col','moldes').contains('data',{produtoIds:[pid]}).order('created_at').limit(1))[0]||null},
async criar(d){await sessaoOk();return ok(await sb.from('docs').insert({col:'moldes',data:d}).select('id').single()).id},
gravar:atualizar,
async produtos(){await sessaoOk();return ok(await sb.from('docs').select('id,data').eq('col','produtos').order('created_at'))},
async produto(id){await sessaoOk();const r=ok(await sb.from('docs').select('data').eq('id',id).eq('col','produtos').maybeSingle());return r?r.data:null},
gravarProduto:atualizar
};
})();

// ---- estado global (usado pelas Tasks 5–6) ----
let M=null,H=null,estado='salvo',molId=null;
let ver=0,salvando=false,timer=null,erroSalvar='',ligadosSalvos=[],zoom=1;
// desenho: vx,vy = canto da vista em mm; sel = ids de traços/pontos soltos/textos selecionados (Task 6 usa); op = ação em curso
let vx=-20,vy=-20,ferr='sel',op=null,rato=null,imaLigado=true,espaco=false,pan=null;
const sel=new Set();
// peças: pecaSel = id da peça no painel; modoPeca = clique no contorno marca bainha/pique/pence; pontaErro = ponta solta do último Extrair
let pecaSel=null,modoPeca=null,pontaErro=null;
const RASC=()=>'molde:'+molId;

function bloquear(msg,entrar){
$('#editor').hidden=true;$('#aviso').hidden=false;
const c=$('#aviso-c');c.textContent=msg;
if(entrar){const a=document.createElement('a');a.href='index.html';a.textContent='Entrar';a.className='pri';a.style.cssText='display:block;margin-top:14px';c.append(a)}
}

function marcar(e){
estado=e;const s=$('#estado');
s.className=e==='salvo'?'ok':erroSalvar&&e==='nao-salvo'?'erro':'';
s.textContent=e==='salvo'?'Salvo':e==='salvando'?'Salvando…':erroSalvar?'Não salvo — tentando de novo':'Não salvo';
s.title=e==='nao-salvo'&&erroSalvar?erroSalvar:'';
}

// redesenha a tela a partir de M. Tasks 5–6 desenham diagrama (#diagrama) e peças (#pecas) aqui.
function desenhar(){
const svg=$('#tela'),r=svg.getBoundingClientRect(),w=(r.width||800)/zoom,h=(r.height||600)/zoom;
svg.setAttribute('viewBox',`${vx} ${vy} ${w} ${h}`);
$('#zoom-v').textContent=Math.round(zoom*100)+'%';
$('#refs-n').textContent=M.produtoIds.length?'('+M.produtoIds.length+')':'';
document.title=(M.nome||'Molde')+' · Editor de molde';
desenharDiagrama(w,h);
desenharPecas();
}

// alteração que vale como passo do histórico
function alterou(){H.gravar(M);sujou()}
// marca não salvo, redesenha e agenda salvar (sem passo no histórico)
function sujou(){ver++;erroSalvar='';pontaErro=null;marcar('nao-salvo');desenhar();desenharPainel();agendar()}
function agendar(ms=1500){clearTimeout(timer);timer=setTimeout(salvar,ms)}
function aplicar(m){M=MM.normalizar(m);$('#nome').value=M.nome;sujou()}

async function salvar(){
clearTimeout(timer);
if(salvando){agendar();return}
if(estado==='salvo')return;
salvando=true;
const v=ver,t=Date.now(),doc={...structuredClone(M),salvoEm:t};
try{localStorage.setItem(RASC(),JSON.stringify({em:t,m:doc}))}catch(e){}
marcar('salvando');
try{
await B.gravar(molId,doc);
await ligarProdutos(doc);
if(ver===v){try{localStorage.removeItem(RASC())}catch(e){}marcar('salvo')}else{marcar('nao-salvo');agendar()}
}catch(e){
console.error(e);erroSalvar=ptErro(e);marcar('nao-salvo');agendar(10000);
}finally{salvando=false}
}

// grava molId e mol nos produtos marcados; tira dos desmarcados desde o último salvamento
async function ligarProdutos(doc){
const mol=MM.molParaProduto(doc),temPecas=mol.pecas.length>0;
const soltos=[];
for(const pid of doc.produtoIds){
const p=await B.produto(pid);
if(!p)continue;
// ligado no último salvamento e agora com outro molId (PLT importado ou outro molde): foi desligado em outro lugar, não retoma
if(ligadosSalvos.includes(pid)&&p.molId!==molId){soltos.push(pid);continue}
// molde sem peça válida: só liga (molId) e mantém o mol atual do produto (ex.: PLT) até haver peça
const novo=temPecas?{...p,molId,mol}:{...p,molId};
if(JSON.stringify(novo)===JSON.stringify(p))continue;
await B.gravarProduto(pid,novo);
}
for(const pid of ligadosSalvos.filter(x=>!doc.produtoIds.includes(x))){
const p=await B.produto(pid);
if(p&&p.molId===molId){
const {molId:_,...resto}=p;
// só tira o mol que veio de um molde do editor; o PLT que nunca foi substituído fica
if(p.mol&&(p.mol.origem==='editor'||String(p.mol.arq).startsWith('Molde: ')))delete resto.mol;
await B.gravarProduto(pid,resto);
}
}
ligadosSalvos=doc.produtoIds.filter(x=>!soltos.includes(x));
if(soltos.length){M.produtoIds=M.produtoIds.filter(x=>!soltos.includes(x));sujou()}
}

// produto que já tem molde (de PLT ou de outro molde): pergunta antes de substituir
function podeLigar(p){
if(!p||!p.mol||p.molId===molId)return true;
const nome=(p.ref?p.ref+' · ':'')+(p.nome||'');
return confirm(p.molId
?`${nome} já está ligado a outro molde (${p.mol.arq||''}). Passar para este molde?`
:`${nome} já tem um molde importado${p.mol.arq?' ('+p.mol.arq+')':''}. Ele continua valendo até este molde ter peças; depois, será substituído por este. Continuar?`);
}

async function abrirRefs(){
const dlg=$('#dlg-refs'),box=$('#refs');
$('#ref-busca').value='';dlg.showModal();
try{
const lista=await B.produtos();
box.textContent='';
if(!lista.length){box.innerHTML='<p class="vazio" style="padding:10px">Nenhum produto cadastrado.</p>';return}
for(const {id,data:p} of lista){
const l=document.createElement('label'),c=document.createElement('input'),s=document.createElement('span');
c.type='checkbox';c.checked=M.produtoIds.includes(id);
s.textContent=(p.ref||'—')+' · '+(p.nome||'');
if(p.mol&&p.molId!==molId){const k=document.createElement('small');k.textContent=p.molId?' (outro molde)':' (molde PLT)';s.append(k)}
c.onchange=()=>{
if(c.checked&&!podeLigar(p)){c.checked=false;return}
if(!c.checked&&M.produtoIds.length===1&&!confirm('Sem produto ligado, este molde só abre pelo endereço desta página. Desligar mesmo assim?')){c.checked=true;return}
M.produtoIds=c.checked?[...M.produtoIds,id]:M.produtoIds.filter(x=>x!==id);
alterou();
};
l.dataset.busca=s.textContent.toLowerCase();l.append(c,s);box.append(l);
}
}catch(e){box.innerHTML='';const p=document.createElement('p');p.className='vazio';p.style.padding='10px';p.textContent='Não foi possível carregar os produtos: '+ptErro(e);box.append(p)}
}

async function abrir(){
let id=Q.get('id');const pid=Q.get('produto');
let doc=id?await B.molde(id):null,pendente=false,criado=false;
if(id&&!doc)return bloquear('Molde não encontrado.');
if(!id&&pid){
const achado=await B.moldePorProduto(pid);
if(achado){id=achado.id;doc=achado.data}
else{
const p=await B.produto(pid);
if(!p)return bloquear('Produto não encontrado.');
doc=MM.novo([p.ref,p.nome].filter(Boolean).join(' ')||'Novo molde');
molId=null;
if(!podeLigar(p))return bloquear('Molde não criado. O produto continua com o molde que já tem.');
doc.produtoIds=[pid];
id=await B.criar(doc);
pendente=criado=true; // primeiro salvamento grava molId/mol no produto
}
}
if(!id)return bloquear('Nenhum molde escolhido. Abra o editor pelo produto, no app.');
molId=id;
const u=new URLSearchParams(location.search);u.delete('produto');u.set('id',id);history.replaceState(null,'','?'+u);
M=MM.normalizar(doc);ligadosSalvos=criado?[]:[...M.produtoIds]; // recém-criado: o produto ainda não tem molId, tem de ligar
let r=null;try{r=JSON.parse(localStorage.getItem(RASC()))}catch(e){}
if(r&&r.em>(doc.salvoEm||0)){
if(confirm('Há alterações deste molde de '+new Date(r.em).toLocaleString('pt-BR')+' que não chegaram ao servidor. Recuperar?')){M=MM.normalizar(r.m);pendente=true}
else try{localStorage.removeItem(RASC())}catch(e){}
}
H=MM.historico();H.gravar(M);
$('#aviso').hidden=true;$('#editor').hidden=false;$('#nome').value=M.nome;
marcar('salvo');if(pendente)sujou();else{desenhar();desenharPainel()}
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),n2=v=>+v.toFixed(2);

function tracoSeguro(t){try{const p=MM.tracoPts(M,t);return p&&p.every(Boolean)?p:null}catch(e){return null}}
function segsTodos(){const out=[];for(const t of M.tracos){const p=tracoSeguro(t);if(!p)continue;if(t.tipo==='circulo')p.push(p[0]);for(let i=1;i<p.length;i++)out.push([p[i-1],p[i]])}return out}
// ímã de 8 px na tela; ponto vence linha

function mm(e){const q=tela.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const r=q.matrixTransform(tela.getScreenCTM().inverse());return {x:r.x,y:r.y}}

f.setAttribute('fill',10*zoom>=4?'url(#grade)':'none');$('#grade path').setAttribute('stroke-width',1/zoom);

for(const id of sel)if(!existe.has(id))sel.delete(id);

for(const t of M.tracos){const p=tracoSeguro(t);if(p)s+=`<path class="tr${sel.has(t.id)?' sel':''}" d="${caminho(p,t.tipo==='circulo')}"/>`}
for(const [id,p] of Object.entries(M.pontos))s+=`<circle class="pt${u.has(id)?'':' solto'}${sel.has(id)?' sel':''}" cx="${n2(p.x)}" cy="${n2(p.y)}" r="${3/zoom}"/>`;

for(const t of M.tracos)if(t.tipo==='curva'&&sel.has(t.id)&&M.pontos[t.a]&&M.pontos[t.b])for(const [k,e] of [['c1','a'],['c2','b']]){
const c=t[k],q=M.pontos[t[e]];s+=`<line class="alca" x1="${n2(q.x)}" y1="${n2(q.y)}" x2="${n2(c.x)}" y2="${n2(c.y)}"/><circle class="alca-p" cx="${n2(c.x)}" cy="${n2(c.y)}" r="${4/zoom}"/>`}

function previa(){
let s='';const r=rato&&rato.p;
if(op&&r){
if(op.tipo==='reta'||(op.tipo==='curva'&&!op.arr))s+=`<path class="prev" d="${caminho([op.A,r])}"/>`;
if(op.tipo==='ret')s+=`<path class="prev" d="${caminho([op.A,{x:r.x,y:op.A.y},r,{x:op.A.x,y:r.y}],1)}"/>`;
if(op.tipo==='circ')s+=`<circle class="prev" cx="${op.C.x}" cy="${op.C.y}" r="${dist(op.C,r)}"/>`;
}
if(op&&op.tipo==='curva'&&op.h)s+=`<line class="alca" x1="${op.A.x}" y1="${op.A.y}" x2="${op.h.x}" y2="${op.h.y}"/>`;
if(op&&op.tipo==='lapis')s+=`<path class="prev" d="${caminho(op.pts)}"/>`;
if(op&&op.tipo==='caixa'){const a=op.ini,b=op.fim;s+=`<rect class="caixa" x="${Math.min(a.x,b.x)}" y="${Math.min(a.y,b.y)}" width="${Math.abs(b.x-a.x)}" height="${Math.abs(b.y-a.y)}"/>`}
if(rato&&rato.tipo){const k=6/zoom;s+=rato.tipo==='ponto'?`<rect class="ima" x="${r.x-k}" y="${r.y-k}" width="${2*k}" height="${2*k}"/>`:`<circle class="ima" cx="${r.x}" cy="${r.y}" r="${k}"/>`}
return s;
}
// régua em cm no alto e à esquerda da vista
function desenharRegua(w,h){
const px=1/zoom,T=16*px,P=[1,2,5,10,20,50,100,200,500,1000];
const tk=P.find(c=>c*10*zoom>=6)||1000,lb=P.find(c=>c*10*zoom>=40)||1000,st=tk*10;
let s=`<rect x="${vx}" y="${vy}" width="${w}" height="${T}"/><rect x="${vx}" y="${vy}" width="${T}" height="${h}"/>`;
for(let i=Math.ceil((vx+T)/st);i*st<=vx+w;i++){const x=i*st,c=i*tk,g=c%lb===0;s+=`<line x1="${x}" x2="${x}" y1="${vy+T}" y2="${vy+T-(g?8:4)*px}"/>`;if(g)s+=`<text x="${x+2*px}" y="${vy+9*px}" font-size="${9*px}">${c}</text>`}
for(let i=Math.ceil((vy+T)/st);i*st<=vy+h;i++){const y=i*st,c=i*tk,g=c%lb===0;s+=`<line y1="${y}" y2="${y}" x1="${vx+T}" x2="${vx+T-(g?8:4)*px}"/>`;if(g)s+=`<text x="${vx+1*px}" y="${y-2*px}" font-size="${9*px}">${c}</text>`}
s+=`<text x="${vx+2*px}" y="${vy+T-3*px}" font-size="${8*px}">cm</text>`;
$('#regua').innerHTML=s;
}

// o que está sob o cursor (raio de 6 px)
function pontoSob(p){let mel=null,md=6/zoom;for(const [id,q] of Object.entries(M.pontos))if(dist(p,q)<=md){md=dist(p,q);mel=id}return mel}
function achar(p){
const r=6/zoom,u=MD.usados(M),pt=pontoSob(p);
if(pt&&!u.has(pt))return pt;
let mel=null,md=r;
for(const t of M.tracos){const q=tracoSeguro(t);if(!q)continue;if(t.tipo==='circulo')q.push(q[0]);for(let i=1;i<q.length;i++){const d=MD.distSeg(p,q[i-1],q[i]);if(d<md){md=d;mel=t.id}}}
if(mel)return mel;
const x=M.textos.find(x=>{const tm=x.tam||10;return p.x>=x.x-r&&p.x<=x.x+tm*.6*String(x.texto).length+r&&p.y>=x.y-tm-r&&p.y<=x.y+r});
return x?x.id:null;
}
function alcaSob(p){for(const t of M.tracos)if(t.tipo==='curva'&&sel.has(t.id))for(const k of ['c1','c2'])if(dist(p,t[k])<=6/zoom)return {t,k};return null}
// alça simétrica por padrão: a da curva vizinha no mesmo ponto espelha (Alt solta)
function moverAlca(o,p,alt){
const t=o.t;t[o.k]={x:p.x,y:p.y};if(alt)return;
const pid=o.k==='c1'?t.a:t.b,P=M.pontos[pid],v=M.tracos.find(u=>u!==t&&u.tipo==='curva'&&(u.a===pid||u.b===pid));
if(v)v[v.a===pid?'c1':'c2']={x:2*P.x-p.x,y:2*P.y-p.y};
}

MD.reta(M,a,b);
const fecha=dist(M.pontos[b],op.ini)<1e-4;
op=fecha?null:{...op,A:{...M.pontos[b]}};
alterou();
}

function edicao(n){
const ids=[...sel];
if(!ids.length)return toast('Selecione os traços primeiro.');
if(n==='medir'){const t='Medida: '+MD.cm(MD.medir(M,ids))+' cm';$('#dica').textContent=t;toast(t);return}
// a edição que quebra o contorno de uma peça pede confirmação
const antes=structuredClone(M),inteiras=new Set(M.pecas.filter(pc=>MD.geoPeca(M,pc)).map(pc=>pc.id));
let r;
if(n==='girar'){const g=(MD.medida(prompt('Girar quantos graus? (positivo = anti-horário)','90'))||[])[0];if(g==null)return;r=MD.girar(M,ids,g)}
else if(n==='arredondar'){const v=(MD.medida(prompt('Raio do canto (cm):','1'))||[])[0];if(v==null)return;r=MD.arredondar(M,ids,v*10)}
else r=MD[n](M,ids);
if(r.erro)return toast(r.erro);
const quebra=M.pecas.filter(pc=>inteiras.has(pc.id)&&!MD.geoPeca(M,pc));
if(quebra.length&&!confirm(`Isto quebra o contorno de: ${quebra.map(pc=>pc.nome).join(', ')}. Continuar? A peça fica marcada como "contorno quebrado".`)){M=antes;desenhar();return}
sel.clear();r.ids.forEach(id=>sel.add(id));
alterou();
}

let aoMedir=null;
function abrirMedida(k,x,y,ph,fn){aoMedir=fn||null;caixa.value=k;caixa.placeholder=ph||T[ferr].medida;caixa.removeAttribute('aria-invalid');caixa.style.left=Math.min(x+12,innerWidth-200)+'px';caixa.style.top=Math.min(y+12,innerHeight-40)+'px';caixa.hidden=false;caixa.focus()}
function fecharMedida(){caixa.hidden=true}
caixa.addEventListener('keydown',e=>{
if(e.key==='Escape'){fecharMedida();e.stopPropagation()}
if(e.key!=='Enter')return;
e.preventDefault();
const v=MD.medida(caixa.value);
if(aoMedir){if(aoMedir(v,caixa.value)===false){caixa.setAttribute('aria-invalid','true');toast('Medida inválida: '+caixa.placeholder)}else fecharMedida();return}
if(!v||!(v[0]>0)||!op){caixa.setAttribute('aria-invalid','true');toast('Medida inválida. Ex.: '+(ferr==='reta'?'11,5;90':'30;50'));return}
fecharMedida();T[ferr].digitado(v);
});
caixa.addEventListener('blur',fecharMedida);

{const nav=$('#ferramentas'),bt=(txt,tit,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=txt;b.title=tit;b.setAttribute('aria-label',tit);b.onclick=fn;nav.append(b);return b};
for(const [f,ic,nome,k] of FERRS)bt(ic,nome+' ('+k+')',()=>escolher(f)).dataset.f=f;
nav.append(document.createElement('hr'));
const im=bt('⌖','Ímã (M)',alternarIma);im.id='btn-ima';im.setAttribute('aria-pressed','true');
nav.append(document.createElement('hr'));
for(const [n,ic,tit] of EDICOES)bt(ic,tit,()=>edicao(n));}
escolher('sel');

// ---- peças (Task 6). Geometria em molde/desenho.js ----
const pecaAtual=()=>M.pecas.find(p=>p.id===pecaSel)||null;
const mm10=cm=>Math.round(cm*100)/10; // cm digitado → mm com 0,1 mm
const MODOS={bainha:'Clique num traço do contorno e digite a margem dele em cm (vazio volta à margem da peça).',pique:'Clique no contorno para pôr um pique; clique num pique para tirar. Esc encerra.',pence:'Clique no contorno onde vai a pence e digite "abertura cm; profundidade cm"; clique numa pence para tirar.'};
function extrair(){
const r=MD.novaPeca(M,[...sel]);
if(!r.ok){toast(r.erro);pontaErro=r.ponta||null;desenhar();return}
sel.clear();pecaSel=r.peca.id;alterou();
}
// ponta da seta do fio da peça selecionada sob o cursor
function fioSob(p){const pc=pecaAtual();if(!pc||!pc.visivel||pc.travada||!MD.geoPeca(M,pc))return null;return ['a','b'].find(k=>dist(p,pc.fio[k])<=6/zoom)||null}
function seta(a,b){const l=dist(a,b)||1,ux=(b.x-a.x)/l,uy=(b.y-a.y)/l,k=8/zoom;return `M${n2(b.x-ux*k-uy*k/2)} ${n2(b.y-uy*k+ux*k/2)}L${n2(b.x)} ${n2(b.y)}L${n2(b.x-ux*k+uy*k/2)} ${n2(b.y-uy*k-ux*k/2)}`}
function desenharPecas(){
let s='';
for(const pc of M.pecas){
const g=pc.visivel&&MD.geoPeca(M,pc);if(!g)continue;
const a=pc.id===pecaSel,b=G.bbox(g.cost),cx=n2(b.x0+b.w/2),cy=b.y0+b.h/2,f=pc.fio,n=+pc.cortar||1,fs=n2(Math.max(4,Math.min(10,b.w/14)));
s+=`<g class="pc${a?' sel':''}"><path class="cost" d="${caminho(g.cost,1)}"/><path class="corte" d="${caminho(g.corte,1)}"/>`;
s+=`<path class="fio" d="${caminho([f.a,f.b])}${seta(f.b,f.a)}${seta(f.a,f.b)}"/>`;
for(const q of pc.piques){const l=MD.pique(M,pc,q);if(l)s+=`<path class="piq" d="${caminho(l)}"/>`}
s+=`<text class="pc-tx" x="${cx}" y="${n2(cy)}" font-size="${fs}" text-anchor="middle">${esc(pc.nome)} · cortar ${n}${pc.par?(n>1?' pares':' par'):''}</text>`;
s+=`<text class="pc-tx" x="${cx}" y="${n2(cy+fs*1.4)}" font-size="${fs}" text-anchor="middle">${esc(M.base)}</text>`;
if(a&&!pc.travada)for(const k of ['a','b'])s+=`<circle class="alca-p" cx="${n2(f[k].x)}" cy="${n2(f[k].y)}" r="${4/zoom}"/>`;
s+='</g>';
}
if(pontaErro)s+=`<circle class="ponta-erro" cx="${n2(pontaErro.x)}" cy="${n2(pontaErro.y)}" r="${8/zoom}"/>`;
$('#pecas').innerHTML=s;
}
// lista do painel; textos do doc só por textContent
function desenharPainel(){
const box=$('#lista-pecas');box.textContent='';
if(!M.pecas.length){const p=document.createElement('p');p.className='vazio';p.textContent='Nenhuma peça ainda. Selecione os traços de um contorno fechado e clique em Extrair molde.';box.append(p)}
for(const pc of M.pecas){
const g=MD.geoPeca(M,pc),li=document.createElement('div');li.className='pc-item';li.dataset.id=pc.id;
const mini=document.createElementNS('http://www.w3.org/2000/svg','svg');mini.setAttribute('class','mini');mini.setAttribute('aria-hidden','true');
if(g){const b=G.bbox(g.cost),k=Math.max(b.w,b.h)*.08;mini.setAttribute('viewBox',`${n2(b.x0-k)} ${n2(b.y0-k)} ${n2(b.w+2*k)} ${n2(b.h+2*k)}`);mini.innerHTML=`<path d="${caminho(g.cost,1)}"/>`}
const nm=document.createElement('button');nm.type='button';nm.className='pc-nome';nm.textContent=pc.nome||'(sem nome)';nm.title='Clique seleciona; duplo clique renomeia';
nm.onclick=()=>{pecaSel=pc.id;modoPeca=null;preencherProps();desenhar()};
nm.ondblclick=()=>{if(!pc.travada)renomear(pc,nm)};
if(!g){const q=document.createElement('small');q.textContent='contorno quebrado';nm.append(q)}
const bt=(txt,tit,fn,pr)=>{const b=document.createElement('button');b.type='button';b.className='ic';b.textContent=txt;b.title=tit;b.setAttribute('aria-label',tit+' '+pc.nome);if(pr!=null)b.setAttribute('aria-pressed',pr);b.onclick=fn;return b};
li.append(mini,nm,
bt('◉','Ver',()=>{pc.visivel=!pc.visivel;alterou()},pc.visivel),
bt('⊠','Travar',()=>{pc.travada=!pc.travada;alterou()},pc.travada),
bt('⧉','Duplicar',()=>{const c=structuredClone(pc);c.id=MD.uid(M,'pc');c.nome=pc.nome+' (cópia)';c.travada=false;M.pecas.push(c);pecaSel=c.id;alterou()}),
bt('✕','Apagar',()=>{if(pc.travada)return toast('Peça travada: destrave para apagar.');if(confirm(`Apagar a peça "${pc.nome}"?`)){M.pecas=M.pecas.filter(x=>x!==pc);alterou()}}));
box.append(li);
}
preencherProps();
}
function renomear(pc,nm){
const i=document.createElement('input');i.className='pc-ren';i.value=pc.nome;i.setAttribute('aria-label','Nome da peça');
let feito=false;
const fim=ok=>{if(feito)return;feito=true;const v=i.value.trim();if(ok&&v&&v!==pc.nome){pc.nome=v;alterou()}else desenharPainel()};
i.onkeydown=e=>{if(e.key==='Enter')fim(true);else if(e.key==='Escape')fim(false)};i.onblur=()=>fim(true);
nm.replaceWith(i);i.focus();i.select();
}
// formulário de propriedades da peça selecionada; não mexe no campo em que o usuário está
function preencherProps(){
if(pecaSel&&!pecaAtual())pecaSel=null;
const pc=pecaAtual(),f=$('#props');
document.querySelectorAll('.pc-item').forEach(li=>li.classList.toggle('sel',li.dataset.id===pecaSel));
f.hidden=!pc;
if(!pc||pc.travada||!MD.geoPeca(M,pc))modoPeca=null;
document.querySelectorAll('#props [data-modo]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.modo===modoPeca));
$('#dica').textContent=modoPeca?MODOS[modoPeca]:T[ferr].dica;
if(!pc)return;
f.disabled=pc.travada;
const por=(id,v)=>{const e=$(id);if(document.activeElement!==e)e[e.type==='checkbox'?'checked':'value']=v};
por('#p-nome',pc.nome);por('#p-cortar',+pc.cortar||1);por('#p-par',pc.par);por('#p-margem',MD.cm(+pc.margem||0));
const d=$('#p-dobra');
if(document.activeElement!==d){
d.textContent='';
const op=(v,t)=>{const o=document.createElement('option');o.value=v;o.textContent=t;d.append(o)};
op('','Sem dobra');
// só traço reto inteiro e sem pence vira dobra (o modelo ignora a dobra em outro caso)
for(const {id} of pc.tracos){const t=M.tracos.find(x=>x.id===id);if(t&&t.tipo==='reta'&&!pc.pences.some(q=>q.tracoId===id))op(id,'Traço '+id+' ('+MD.cm(MD.medir(M,[id]))+' cm)')}
d.value=pc.dobra?pc.dobra.tracoId:'';
}
const mt=Object.entries(pc.margemTraco).map(([id,v])=>id+': '+MD.cm(+v||0)+' cm');
$('#p-info').textContent=`${pc.piques.length} pique(s) · ${pc.pences.length} pence(s)`+(mt.length?' · margem do traço '+mt.join(', '):'');
}
// campos: aplica no 'change' (o painel é refeito a cada alteração)
const campo=fn=>e=>{const pc=pecaAtual();if(!pc||pc.travada)return;if(fn(pc,e.target)===false){preencherProps();return}alterou()};
$('#p-nome').addEventListener('change',campo((pc,i)=>{const v=i.value.trim();if(!v)return false;pc.nome=v}));
$('#p-cortar').addEventListener('change',campo((pc,i)=>{const n=Math.round(+i.value);if(!(n>=1)){toast('Cortar: número inteiro a partir de 1.');return false}pc.cortar=n}));
$('#p-par').addEventListener('change',campo((pc,i)=>{pc.par=i.checked}));
$('#p-margem').addEventListener('change',campo((pc,i)=>{const v=MD.medida(i.value);if(!v||v.length>1||!(v[0]>=0)){toast('Margem inválida. Ex.: 1 ou 1,5');return false}pc.margem=mm10(v[0])}));
$('#p-dobra').addEventListener('change',campo((pc,i)=>{pc.dobra=i.value?{tracoId:i.value}:null}));
document.querySelectorAll('#props [data-modo]').forEach(b=>b.onclick=()=>{modoPeca=modoPeca===b.dataset.modo?null:b.dataset.modo;op=null;preencherProps();desenhar()});
$('#btn-extrair').onclick=extrair;
// clique na tela com um modo de peça ligado
function cliquePeca(p,e){
const pc=pecaAtual();if(!pc||pc.travada)return;
const h=MD.naPeca(M,pc,p);
if(!h||h.d>8/zoom)return toast('Clique sobre o contorno da peça.');
const perto=q=>q.tracoId===h.tracoId&&Math.abs(q.t-h.t)*h.L*zoom<=8,t=+h.t.toFixed(4);
if(modoPeca==='pique'){const i=pc.piques.findIndex(perto);if(i>=0)pc.piques.splice(i,1);else pc.piques.push({tracoId:h.tracoId,t});alterou();return}
if(modoPeca==='pence'){
const i=pc.pences.findIndex(perto);if(i>=0){pc.pences.splice(i,1);alterou();return}
if(pc.dobra&&pc.dobra.tracoId===h.tracoId)return toast('O traço da dobra não leva pence.');
abrirMedida('',e.clientX,e.clientY,'abertura cm; profundidade cm',v=>{
if(!v||v.length!==2||!(v[0]>0)||!(v[1]>0)||v[0]*10>=h.L)return false;
pc.pences.push({tracoId:h.tracoId,t,abertura:mm10(v[0]),profundidade:mm10(v[1])});alterou()});
return}
if(modoPeca==='bainha'){
const at=pc.margemTraco[h.tracoId];
abrirMedida(at==null?'':MD.cm(+at||0),e.clientX,e.clientY,'margem deste traço, cm',(v,txt)=>{
if(!txt.trim())delete pc.margemTraco[h.tracoId];
else if(!v||v.length>1||!(v[0]>=0))return false;
else pc.margemTraco[h.tracoId]=mm10(v[0]);
alterou()})}
}

let ultCli={x:0,y:0};
tela.addEventListener('pointerdown',e=>{
if(!M)return;
if(e.button===1||(e.button===0&&espaco)){pan={x:e.clientX,y:e.clientY,vx,vy};tela.setPointerCapture(e.pointerId);e.preventDefault();return}
if(e.button===2){op=null;desenhar();return}
if(e.button!==0)return;
if(modoPeca){e.preventDefault();return}
tela.setPointerCapture(e.pointerId);
const p=mm(e);T[ferr].down&&T[ferr].down(p,e);desenhar();
});
tela.addEventListener('pointermove',e=>{
if(!M)return;ultCli={x:e.clientX,y:e.clientY};
if(pan){vx=pan.vx-(e.clientX-pan.x)/zoom;vy=pan.vy-(e.clientY-pan.y)/zoom;desenhar();return}
const p=mm(e);
rato=ferr==='sel'?null:grudar(p);
T[ferr].move&&T[ferr].move(p,e);desenhar();
});
tela.addEventListener('pointerup',e=>{if(!M)return;if(pan){pan=null;return}if(e.button!==0)return;if(modoPeca)cliquePeca(mm(e),e);else if(T[ferr].up)T[ferr].up(mm(e),e)});
tela.addEventListener('pointerleave',()=>{if(rato){rato=null;desenhar()}});
tela.addEventListener('contextmenu',e=>e.preventDefault());
tela.addEventListener('wheel',e=>{if(!M)return;e.preventDefault();zoomEm(e.clientX,e.clientY,Math.pow(1.0015,-e.deltaY))},{passive:false});
// mantém o ponto sob o cursor parado
function zoomEm(cx,cy,f){const r=tela.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,mx=vx+px/zoom,my=vy+py/zoom;zoom=Math.min(20,Math.max(.1,zoom*f));vx=mx-px/zoom;vy=my-py/zoom;desenhar()}
function zoomMeio(f){const r=tela.getBoundingClientRect();zoomEm(r.left+r.width/2,r.top+r.height/2,f)}
document.addEventListener('keydown',e=>{
if(!M||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,dialog,select'))return;
const k=e.key;
if(op&&T[ferr].digitado&&/^[0-9,.\-]$/.test(k)){e.preventDefault();abrirMedida(k,ultCli.x,ultCli.y);return}
if(k==='Escape'){op=null;modoPeca=null;preencherProps();desenhar();return}
if(k==='Delete'||k==='Backspace'){e.preventDefault();if(sel.size)edicao('apagar');return}
if(k===' '){if(!e.target.closest('button,a')){espaco=true;e.preventDefault()}return}
const l=k.toLowerCase();
if(l==='m'){alternarIma();return}
const f=FERRS.find(x=>x[3].toLowerCase()===l);if(f)escolher(f[0]);
});
document.addEventListener('keyup',e=>{if(e.key===' ')espaco=false});
iniciar();
</script>
